<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Gestor de tareas de Nico Llano</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root{
    --bg:#f7f7f5;
    --panel:#ffffff;
    --border:#e2e0db;
    --text:#26241f;
    --muted:#726f66;
    --accent:#25D366;
    --accent-dark:#128C7E;
    --accent-soft:#e3f9ec;
    --danger:#a4432f;
    --radius:8px;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;
    background:var(--bg);
    color:var(--text);
    font-size:14px;
    line-height:1.4;
  }
  .app{max-width:1100px;margin:0 auto;padding:12px;}
  h1{font-size:17px;margin:0 0 10px 0;}
  h2{font-size:15px;margin:0 0 10px 0;color:var(--text);}

  nav{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-bottom:14px;}
  nav button{
    padding:9px 6px;border:1px solid var(--border);background:var(--panel);
    border-radius:var(--radius);cursor:pointer;font-size:12px;color:var(--text);
    min-height:44px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;position:relative;
  }
  nav button.active{background:var(--accent);color:#fff;border-color:var(--accent);}
  @media (max-width:480px){
    nav button{font-size:10.5px;padding:8px 4px;}
  }

  .notif-badge{
    position:absolute;top:-6px;right:-6px;background:#ff3b30;color:#fff;
    border-radius:999px;min-width:18px;height:18px;padding:0 4px;
    font-size:10.5px;font-weight:700;display:flex;align-items:center;justify-content:center;
    line-height:1;box-shadow:0 0 0 2px var(--bg);
  }

  .panel{background:var(--panel);border:1px solid var(--border);border-radius:var(--radius);padding:14px;margin-bottom:14px;}

  label{display:block;font-size:12px;color:var(--muted);margin-bottom:3px;margin-top:8px;}
  input[type=text],input[type=date],select,textarea{
    width:100%;padding:9px 8px;border:1px solid var(--border);border-radius:6px;
    font-size:14px;background:#fff;color:var(--text);font-family:inherit;min-height:38px;
  }
  textarea{resize:vertical;}
  .row{display:flex;gap:10px;flex-wrap:wrap;}
  .row > div{flex:1;min-width:140px;}
  .field-with-btn{display:flex;gap:6px;align-items:flex-end;}
  .field-with-btn > div{flex:1;}

  button.primary,button.secondary,button.danger{
    min-height:40px;padding:0 14px;border-radius:6px;cursor:pointer;
    font-size:13px;font-weight:600;line-height:1;box-sizing:border-box;
  }
  button.primary{background:var(--accent);color:#fff;border:none;}
  button.secondary{background:#fff;color:var(--text);border:1px solid var(--border);}
  button.danger{background:#fff;color:var(--danger);border:1px solid var(--danger);}
  .task-actions{display:flex;gap:10px;margin-top:8px;flex-wrap:wrap;}
  .task-actions button{flex:1 1 auto;min-width:110px;}
  @media (max-width:480px){
    .task-actions button{min-width:0;flex:1 1 45%;}
  }

  .icon-actions{display:flex;gap:6px;flex-wrap:wrap;flex-shrink:0;}
  .icon-btn{
    width:34px;height:34px;padding:0;border:1px solid var(--border);background:var(--panel);
    border-radius:var(--radius);cursor:pointer;font-size:12.5px;color:var(--text);
    display:inline-flex;align-items:center;justify-content:center;
    box-sizing:border-box;flex-shrink:0;
  }
  .icon-btn:active{transform:scale(0.96);}
  @media (max-width:480px){
    .icon-btn{font-size:11.5px;width:32px;height:32px;}
  }

  .task-card{
    border:1px solid var(--border);border-radius:6px;padding:10px;margin-bottom:8px;background:#fdfdfc;
  }
  .task-top{display:flex;justify-content:space-between;align-items:flex-start;gap:8px;}
  .task-name{font-weight:600;font-size:13.5px;}
  .task-meta{font-size:11.5px;color:var(--muted);margin-top:2px;}
  .task-notes{font-size:11.5px;color:var(--text);margin-top:6px;background:#f7f7f5;border-radius:4px;padding:6px 8px;}
  .badge{display:inline-block;padding:1px 6px;border-radius:10px;font-size:10.5px;margin-right:4px;background:var(--accent-soft);color:var(--accent-dark);}
  .badge.status-organizar{background:#fce8e6;color:#c5221f;}
  .badge.status-sin-iniciar{background:#e8f0fe;color:#1967d2;}
  .badge.status-ejecucion{background:#fef7e0;color:#a35b00;}
  .badge.status-pendiente{background:#f3e8fd;color:#7c3aed;}
  .badge.status-terminada{background:var(--accent-soft);color:var(--accent-dark);}
  .task-card.status-organizar{border-left:3px solid #c5221f;}
  .task-card.status-sin-iniciar{border-left:3px solid #4285F4;}
  .task-card.status-ejecucion{border-left:3px solid #FBBC05;}
  .task-card.status-pendiente{border-left:3px solid #7c3aed;}

  .empty{color:var(--muted);font-size:12.5px;padding:10px 0;}

  .area-block{margin-bottom:22px;}
  .hoy-grid{display:grid;grid-template-columns:1fr;gap:16px;}
  @media (min-width:700px){ .hoy-grid{grid-template-columns:repeat(2,1fr);} }
  @media (min-width:1000px){ .hoy-grid{grid-template-columns:repeat(4,1fr);} }
  .hoy-grid .area-block{margin-bottom:0;min-width:0;}
  .area-title{font-size:15px;font-weight:700;margin-bottom:8px;padding-bottom:4px;border-bottom:2px solid var(--accent);}
  .section-title{font-size:12px;font-weight:700;margin:14px 0 6px 0;color:#fff;background:var(--accent);display:inline-block;padding:2px 8px;border-radius:4px;}
  .cat-title{font-size:11.5px;color:var(--muted);margin:8px 0 4px 0;}

  .edit-grid{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:8px;}
  .edit-grid label{margin-top:0;}
  .edit-grid .full{grid-column:1/-1;}

  .status-msg{font-size:12px;color:var(--muted);margin-bottom:8px;}
  select.mini{padding:4px 6px;font-size:12px;}

  .quick-add-row{display:flex;gap:8px;align-items:flex-end;}
  .quick-add-row textarea{flex:1;min-height:44px;max-height:160px;resize:vertical;}
  .send-btn{
    flex:0 0 auto;width:44px;height:44px;border-radius:50%;border:none;
    background:var(--accent);color:#fff;font-size:18px;cursor:pointer;
    display:flex;align-items:center;justify-content:center;line-height:1;
  }
  .send-btn:active{opacity:.85;}

  .combobox{position:relative;}
  .combobox input{padding-right:30px;background:#fff;}
  .combobox::after{
    content:"▾";position:absolute;right:10px;top:50%;transform:translateY(-50%);
    color:var(--muted);pointer-events:none;font-size:12px;
  }

  .progress-track{background:#ece9e3;border-radius:6px;height:10px;overflow:hidden;margin-top:6px;}
  .progress-fill{background:var(--accent);height:100%;border-radius:6px;}
  .money-row{display:flex;justify-content:space-between;align-items:center;}
  .money-row.total{font-weight:700;font-size:15px;border-top:1px solid var(--border);margin-top:6px;padding-top:8px;}
  .money-negative{color:var(--danger);}
  .money-positive{color:var(--accent-dark);}
</style>
</head>
<body>
<div class="app">
  <h1>Gestor de tareas de Nico Llano</h1>
  <nav id="tabs"></nav>
  <nav id="tabs-secondary" class="nav-secondary"></nav>
  <div id="content"></div>
</div>

<script>
const AREAS = ['Personales','UTadeo','CDTIC','CNA'];
const AREA_LABEL = {Personales:'Personales', UTadeo:'UTadeo', CDTIC:'Alcaldía (CDTIC)', CNA:'CNA'};
const PRIORITIES = ['Alta','Media','Baja'];
const EFFORTS = ['Alto','Medio','Bajo'];
const ENERGIES = ['Alta','Baja'];
const STATUSES = ['Por organizar','Sin iniciar','En ejecución','Pendiente','Terminada'];

const CATEGORY_MAP = {
  'Alta|Bajo|Alta':   {section:'HOY - HACERLAS YA', order:1},
  'Alta|Bajo|Baja':   {section:'HOY - HACERLAS YA', order:2},
  'Alta|Alto|Alta':   {section:'HOY - DURANTE EL DÍA', order:3},
  'Alta|Alto|Baja':   {section:'PROGRAMAR', order:4},
  'Alta|Medio|Alta':  {section:'PROGRAMAR', order:5},
  'Alta|Medio|Baja':  {section:'PROGRAMAR', order:6},
  'Media|Medio|Alta': {section:'PROGRAMAR', order:7},
  'Media|Medio|Baja': {section:'PROGRAMAR', order:8},
  'Media|Alto|Alta':  {section:'PROGRAMAR', order:9},
  'Media|Alto|Baja':  {section:'PROGRAMAR', order:10},
  'Media|Bajo|Alta':  {section:'PROGRAMAR', order:11},
  'Baja|Bajo|Alta':   {section:'PROGRAMAR', order:12},
  'Baja|Alto|Alta':   {section:'EN ESPERA', order:13},
  'Baja|Alto|Baja':   {section:'EN ESPERA', order:14},
  'Baja|Medio|Alta':  {section:'EN ESPERA', order:15},
  'Baja|Medio|Baja':  {section:'EN ESPERA', order:16},
  'Media|Bajo|Baja':  {section:'EN CAMINO', order:17},
  'Baja|Bajo|Baja':   {section:'EN CAMINO', order:18},
};
const SECTION_ORDER = ['HOY - HACERLAS YA','HOY - DURANTE EL DÍA','PROGRAMAR','EN ESPERA','EN CAMINO'];

function getCategory(p,e,en){
  if(!p||!e||!en) return null;
  return CATEGORY_MAP[p+'|'+e+'|'+en] || null;
}
function todayStr(){
  const d = new Date();
  return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
}
function tomorrowStr(){
  const d = new Date();
  d.setDate(d.getDate()+1);
  return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
}
function uid(){ return 't_'+Date.now()+'_'+Math.random().toString(36).slice(2,8); }
function setToday(inputId){
  const el = document.getElementById(inputId);
  if(el) el.value = todayStr();
}
window.setToday = setToday;

const SECTION_DEFAULTS = {
  'HOY - HACERLAS YA': {priority:'Alta', effort:'Bajo', energy:'Alta'},
  'HOY - DURANTE EL DÍA': {priority:'Alta', effort:'Alto', energy:'Alta'},
  'PROGRAMAR': {priority:'Alta', effort:'Alto', energy:'Baja'},
  'EN ESPERA': {priority:'Baja', effort:'Alto', energy:'Alta'},
  'EN CAMINO': {priority:'Media', effort:'Bajo', energy:'Baja'},
};
function applySectionDefault(section){
  const d = SECTION_DEFAULTS[section];
  if(!d) return;
  const pEl = document.getElementById('d_priority');
  const eEl = document.getElementById('d_effort');
  const nEl = document.getElementById('d_energy');
  if(pEl) pEl.value = d.priority;
  if(eEl) eEl.value = d.effort;
  if(nEl) nEl.value = d.energy;
}
window.applySectionDefault = applySectionDefault;
function blankTask(){
  return {id:null, name:'', area:null, date:null, priority:null, effort:null, energy:null, project:null, notes:'', status:'Por organizar', completedDate:null, createdAt:null};
}

const ICONS = {
  edit: '✏️',
  check: '✅',
  trash: '🗑️',
  save: '💾',
  x: '↩️',
  list: '📋',
  postpone: '⏭️',
  view: '👁️',
};
function iconAction(cls, icon, label, dataAttr){
  return `<button type="button" class="icon-btn" ${dataAttr} title="${label}" aria-label="${label}">${ICONS[icon]}</button>`;
}

let tasks = [];
let projects = [];
let currentTab = 'crear';
let homeSection = null;
let editingTaskId = null;
let pendingDeleteId = null;
let matrixAreaFilter = null;
let expandedProjectId = null;
let editingProjectId = null;
let pendingProjectDeleteId = null;
let expandedSection = null;
let viewingTaskId = null;

// ---------- Estado del módulo Gastos ----------
let gastosIngresos = [];
let gastosFijos = [];
let gastosCiclicos = [];
let gastosExtraordinarios = [];
let gastosEspera = [];
let gastosPrestamos = [];
let gastosSubTab = 'resumen';
let gastosViewMonth = null;
let gastosEditingId = null;
let gastosPendingDeleteId = null;
let gastosSaldoInicial = {};
let gastosMesesCerrados = {};

function monthStr(d){ return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0'); }
function currentMonthStr(){ return monthStr(new Date()); }
function addMonths(ym, delta){
  const [y,m] = ym.split('-').map(Number);
  const d = new Date(y, (m-1)+delta, 1);
  return monthStr(d);
}
function monthLabel(ym){
  const [y,m] = ym.split('-').map(Number);
  const names = ['Enero','Febrero','Marzo','Abril','Mayo','Junio','Julio','Agosto','Septiembre','Octubre','Noviembre','Diciembre'];
  return names[m-1]+' '+y;
}
function formatCOP(n){
  n = Math.round(Number(n)||0);
  return '$'+n.toLocaleString('es-CO');
}
function addMonthsToDate(dateStr, months){
  if(!dateStr) return null;
  const [y,m,d] = dateStr.split('-').map(Number);
  const nd = new Date(y, (m-1)+months, d);
  return monthStr(nd)+'-'+String(nd.getDate()).padStart(2,'0');
}
let pendingImportText = '';
let importConfirmPending = false;
let importWarnings = [];

// ======================================================
// CONFIGURACIÓN DE SUPABASE — ya configurado para TareasNico
// ======================================================
const SUPABASE_URL = 'https://wfzmpdcxyuskfyjnwmme.supabase.co';
const SUPABASE_ANON_KEY = 'sb_publishable_KGfozOeJvj6vJBzHOTnWVg_wezXkWsH';
const supabaseClient = (SUPABASE_URL.startsWith('http'))
  ? supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY)
  : null;

async function kvGet(key){
  if(!supabaseClient) return null;
  const { data, error } = await supabaseClient.from('kv_store').select('value').eq('key',key).maybeSingle();
  if(error) throw error;
  return data ? data.value : null;
}
async function kvSet(key, value){
  if(!supabaseClient) return;
  const { error } = await supabaseClient.from('kv_store').upsert({ key, value });
  if(error) throw error;
}

async function loadData(){
  if(!supabaseClient){
    alert('Falta configurar Supabase: edita SUPABASE_URL y SUPABASE_ANON_KEY en el código.');
    tasks = []; projects = [];
    gastosIngresos = []; gastosFijos = []; gastosCiclicos = []; gastosExtraordinarios = []; gastosEspera = []; gastosPrestamos = [];
    gastosSaldoInicial = {}; gastosMesesCerrados = {};
    return;
  }
  try{ tasks = (await kvGet('tasks')) || []; }catch(e){ console.error('Error cargando tareas', e); tasks = []; }
  try{ projects = (await kvGet('projects')) || []; }catch(e){ console.error('Error cargando proyectos', e); projects = []; }
  try{ gastosIngresos = (await kvGet('gastos_ingresos')) || []; }catch(e){ console.error('Error cargando gastos_ingresos', e); gastosIngresos = []; }
  try{ gastosFijos = (await kvGet('gastos_fijos')) || []; }catch(e){ console.error('Error cargando gastos_fijos', e); gastosFijos = []; }
  try{ gastosCiclicos = (await kvGet('gastos_ciclicos')) || []; }catch(e){ console.error('Error cargando gastos_ciclicos', e); gastosCiclicos = []; }
  try{ gastosExtraordinarios = (await kvGet('gastos_extraordinarios')) || []; }catch(e){ console.error('Error cargando gastos_extraordinarios', e); gastosExtraordinarios = []; }
  try{ gastosEspera = (await kvGet('gastos_espera')) || []; }catch(e){ console.error('Error cargando gastos_espera', e); gastosEspera = []; }
  try{ gastosPrestamos = (await kvGet('gastos_prestamos')) || []; }catch(e){ console.error('Error cargando gastos_prestamos', e); gastosPrestamos = []; }
  try{
    const parsed = await kvGet('gastos_saldo');
    gastosSaldoInicial = parsed ? (parsed.inicial||{}) : {};
    gastosMesesCerrados = parsed ? (parsed.cerrados||{}) : {};
  }catch(e){ console.error('Error cargando gastos_saldo', e); gastosSaldoInicial = {}; gastosMesesCerrados = {}; }
}
async function saveTasks(){
  try{ await kvSet('tasks', tasks); }
  catch(e){ console.error('Error guardando tareas', e); alert('No se pudo guardar. Intenta de nuevo.'); }
}
async function saveProjects(){
  try{ await kvSet('projects', projects); }
  catch(e){ console.error('Error guardando proyectos', e); }
}
async function saveGastosSaldo(){
  try{ await kvSet('gastos_saldo', { inicial: gastosSaldoInicial, cerrados: gastosMesesCerrados }); }
  catch(e){ console.error('Error guardando saldo', e); alert('No se pudo guardar. Intenta de nuevo.'); }
}
async function saveGastos(cat){
  const map = {
    ingresos: gastosIngresos,
    fijos: gastosFijos,
    ciclicos: gastosCiclicos,
    extraordinarios: gastosExtraordinarios,
    espera: gastosEspera,
    prestamos: gastosPrestamos,
  };
  try{ await kvSet('gastos_'+cat, map[cat]); }
  catch(e){ console.error('Error guardando gastos_'+cat, e); alert('No se pudo guardar. Intenta de nuevo.'); }
}

function reprogramOverdue(){
  const today = todayStr();
  let changed = false;
  tasks.forEach(t=>{
    if((t.status==='Sin iniciar' || t.status==='En ejecución' || t.status==='Pendiente') && t.date && t.date < today){
      t.date = today;
      changed = true;
    }
  });
  return changed;
}

function getOrCreateProject(name, area){
  name = name.trim();
  if(!name) return null;
  let existing = projects.find(p=>p.name.toLowerCase()===name.toLowerCase());
  if(existing) return existing;
  const p = {id:uid(), name, area:area||null};
  projects.push(p);
  return p;
}
function projectsByArea(area){
  return projects.filter(p=>p.area===area).sort((a,b)=>a.name.localeCompare(b.name,'es',{sensitivity:'base'}));
}

// ---------- Tabs ----------
function renderTabs(){
  const nav = document.getElementById('tabs');
  const navSec = document.getElementById('tabs-secondary');
  if(homeSection===null){
    nav.innerHTML = '';
    navSec.innerHTML = '';
    return;
  }

  let primary, secondary;
  if(homeSection==='tareas'){
    primary = [
      ['crear','➕ Crear tarea'],
      ['organizar','📥 Organizar tareas'],
      ['hoy','📅 HOY'],
      ['proyectos','📁 Proyectos'],
    ];
    secondary = [
      ['matriz-area','🗂️ Tareas por tema'],
      ['matriz-general','📋 Todas las tareas'],
      ['completadas','✅ ¡Lo hice!'],
      ['datos','📊 Datos'],
    ];
  } else {
    primary = [
      ['g-resumen','📊 Resumen'],
      ['g-dia','📅 Pagos por hacer'],
      ['g-ingresos','💵 Ingresos'],
      ['g-fijos','📌 Pagos Fijos'],
    ];
    secondary = [
      ['g-ciclicos','🐷 Ahorros'],
      ['g-imprevistos','⚡ Imprevistos'],
      ['g-espera','⏳ Lo que debo'],
      ['g-prestamos','🤝 Lo que me deben'],
    ];
  }
  const pendCount = tasks.filter(t=>t.status==='Por organizar').length;

  nav.innerHTML = '';
  navSec.innerHTML = '';

  const homeBtn = document.createElement('button');
  homeBtn.textContent = '🏠 Inicio';
  homeBtn.title = 'Inicio';
  homeBtn.setAttribute('aria-label','Inicio');
  homeBtn.onclick = ()=>{ homeSection=null; render(); };
  nav.appendChild(homeBtn);

  const allTabs = primary.concat(secondary);
  allTabs.forEach(([key,label])=>{
    const b = document.createElement('button');
    b.textContent = label;
    if(key===currentTab) b.className='active';
    b.onclick = ()=>{ currentTab=key; editingTaskId=null; pendingDeleteId=null; gastosEditingId=null; gastosPendingDeleteId=null; render(); };
    if(key==='organizar' && pendCount>0){
      const badge = document.createElement('span');
      badge.className = 'notif-badge';
      badge.textContent = pendCount>99 ? '99+' : String(pendCount);
      b.appendChild(badge);
    }
    nav.appendChild(b);
  });
}

function viewHome(){
  return `
  <div class="panel" style="text-align:center;padding:36px 16px;">
    <h2 style="margin-bottom:20px;">¿Qué quieres hacer?</h2>
    <button type="button" class="primary" data-home-select="tareas" style="width:100%;padding:18px;font-size:16px;margin-bottom:12px;">🗂️ Tareas</button>
    <button type="button" class="primary" data-home-select="gastos" style="width:100%;padding:18px;font-size:16px;">💰 Gastos</button>
  </div>`;
}

function render(){
  renderTabs();
  const c = document.getElementById('content');
  if(homeSection===null){ c.innerHTML = viewHome(); bindEvents(); return; }
  if(homeSection==='tareas'){
    if(currentTab==='crear') c.innerHTML = viewCrear();
    else if(currentTab==='organizar') c.innerHTML = viewOrganizar();
    else if(currentTab==='hoy') c.innerHTML = viewHoy();
    else if(currentTab==='matriz-area') c.innerHTML = viewMatrizArea();
    else if(currentTab==='matriz-general') c.innerHTML = viewMatrizGeneral();
    else if(currentTab==='completadas') c.innerHTML = viewCompletadas();
    else if(currentTab==='proyectos') c.innerHTML = viewProyectos();
    else if(currentTab==='datos') c.innerHTML = viewDatos();
  } else {
    if(currentTab==='g-resumen') c.innerHTML = viewGastosResumen();
    else if(currentTab==='g-dia') c.innerHTML = viewGastosDia();
    else if(currentTab==='g-ingresos') c.innerHTML = viewGastosSimpleList('ingresos', gastosIngresos, 'Ingresos mensuales recurrentes');
    else if(currentTab==='g-fijos') c.innerHTML = viewGastosSimpleList('fijos', gastosFijos, 'Pagos Fijos');
    else if(currentTab==='g-ciclicos') c.innerHTML = viewGastosCiclicos();
    else if(currentTab==='g-imprevistos') c.innerHTML = viewGastosDatedList('extraordinarios', gastosExtraordinarios, 'Imprevistos', true);
    else if(currentTab==='g-espera') c.innerHTML = viewGastosEspera();
    else if(currentTab==='g-prestamos') c.innerHTML = viewGastosPrestamos();
  }
  bindEvents();
}

// ---------- Interfaz HOY ----------
function viewHoy(){
  const today = todayStr();
  let html = `<div class="panel"><h2>HOY (${today})</h2><div class="status-msg">Solo tareas programadas para hoy. Orden: 1) En ejecución, 2) Pendientes, 3) Sin iniciar.</div></div>`;
  let anyToday = false;
  let grid = '';
  AREAS.forEach(area=>{
    const areaTasks = tasks.filter(t=>t.area===area && t.date===today && (t.status==='Sin iniciar'||t.status==='En ejecución'||t.status==='Pendiente'));
    if(areaTasks.length===0) return;
    anyToday = true;
    grid += `<div class="area-block"><div class="area-title">${AREA_LABEL[area]}</div>`;

    const uncategorized = areaTasks.filter(t=>!getCategory(t.priority,t.effort,t.energy));
    if(uncategorized.length){
      grid += `<div class="cat-title">Sin categorizar (falta prioridad, esfuerzo o energía)</div>`;
      grid += renderTaskList(sortTasks(uncategorized), false, true, false, true);
    }

    SECTION_ORDER.forEach(section=>{
      const catsInSection = Object.entries(CATEGORY_MAP).filter(([k,v])=>v.section===section).sort((a,b)=>a[1].order-b[1].order);
      let sectionTasksTotal = [];
      catsInSection.forEach(([key])=>{
        const [p,e,en] = key.split('|');
        sectionTasksTotal = sectionTasksTotal.concat(areaTasks.filter(t=>t.priority===p&&t.effort===e&&t.energy===en));
      });
      if(sectionTasksTotal.length===0) return;
      grid += `<div class="section-title">${section}</div>`;
      catsInSection.forEach(([key])=>{
        const [p,e,en] = key.split('|');
        const catTasks = sortTasks(areaTasks.filter(t=>t.priority===p&&t.effort===e&&t.energy===en));
        if(catTasks.length===0) return;
        grid += `<div class="cat-title">${p} prioridad · ${e} esfuerzo · ${en} energía</div>`;
        grid += renderTaskList(catTasks, false, true, false, true);
      });
    });
    grid += `</div>`;
  });
  if(!anyToday) html += `<div class="panel"><div class="empty">No tienes tareas programadas para hoy.</div></div>`;
  else html += `<div class="hoy-grid">${grid}</div>`;
  return html;
}

// ---------- Interfaz Tareas por tema (matriz por área) ----------
function viewMatrizArea(){
  let html = `<div class="panel"><h2>Tareas por tema</h2><div class="status-msg">En cada categoría: primero tareas "En ejecución", luego "Sin iniciar" — ordenadas por fecha más próxima primero.</div></div>`;
  AREAS.forEach(area=>{
    const areaTasks = tasks.filter(t=>t.area===area && (t.status==='Sin iniciar'||t.status==='En ejecución'||t.status==='Pendiente'));
    html += `<div class="area-block"><div class="area-title">${AREA_LABEL[area]}</div>`;

    const uncategorized = areaTasks.filter(t=>!getCategory(t.priority,t.effort,t.energy));
    if(uncategorized.length){
      html += `<div class="cat-title">Sin categorizar (falta prioridad, esfuerzo o energía)</div>`;
      html += renderTaskList(sortTasks(uncategorized));
    }

    SECTION_ORDER.forEach(section=>{
      const catsInSection = Object.entries(CATEGORY_MAP).filter(([k,v])=>v.section===section).sort((a,b)=>a[1].order-b[1].order);
      let sectionTasksTotal = [];
      catsInSection.forEach(([key])=>{
        const [p,e,en] = key.split('|');
        const catTasks = areaTasks.filter(t=>t.priority===p&&t.effort===e&&t.energy===en);
        sectionTasksTotal = sectionTasksTotal.concat(catTasks);
      });
      if(sectionTasksTotal.length===0 && section!=='EN CAMINO') return;
      html += `<div class="section-title">${section}</div>`;
      if(sectionTasksTotal.length===0){
        html += `<div class="empty">Sin tareas en esta sección.</div>`;
      } else {
        catsInSection.forEach(([key])=>{
          const [p,e,en] = key.split('|');
          const catTasks = sortTasks(areaTasks.filter(t=>t.priority===p&&t.effort===e&&t.energy===en));
          if(catTasks.length===0) return;
          html += `<div class="cat-title">${p} prioridad · ${e} esfuerzo · ${en} energía</div>`;
          html += renderTaskList(catTasks);
        });
      }
    });
    html += `</div>`;
  });
  return html;
}

// ---------- Interfaz Todas las tareas (matriz general) ----------
function viewMatrizGeneral(){
  let html = `<div class="panel"><h2>Todas las tareas</h2><div class="status-msg">Todas las áreas juntas, en las mismas categorías, ordenadas solo por fecha (más próxima primero).</div></div>`;
  const allTasks = tasks.filter(t=>t.status==='Sin iniciar'||t.status==='En ejecución'||t.status==='Pendiente');

  const uncategorized = allTasks.filter(t=>!getCategory(t.priority,t.effort,t.energy));
  if(uncategorized.length){
    html += `<div class="cat-title">Sin categorizar (falta prioridad, esfuerzo o energía)</div>`;
    html += renderTaskList(sortByDateOnly(uncategorized), true);
  }

  SECTION_ORDER.forEach(section=>{
    const catsInSection = Object.entries(CATEGORY_MAP).filter(([k,v])=>v.section===section).sort((a,b)=>a[1].order-b[1].order);
    let sectionTasksTotal = [];
    catsInSection.forEach(([key])=>{
      const [p,e,en] = key.split('|');
      sectionTasksTotal = sectionTasksTotal.concat(allTasks.filter(t=>t.priority===p&&t.effort===e&&t.energy===en));
    });
    if(sectionTasksTotal.length===0 && section!=='EN CAMINO') return;
    html += `<div class="section-title">${section}</div>`;
    if(sectionTasksTotal.length===0){
      html += `<div class="empty">Sin tareas en esta sección.</div>`;
    } else {
      catsInSection.forEach(([key])=>{
        const [p,e,en] = key.split('|');
        const catTasks = sortByDateOnly(allTasks.filter(t=>t.priority===p&&t.effort===e&&t.energy===en));
        if(catTasks.length===0) return;
        html += `<div class="cat-title">${p} prioridad · ${e} esfuerzo · ${en} energía</div>`;
        html += renderTaskList(catTasks, true);
      });
    }
  });
  return html;
}
function sortByDateOnly(list){
  return list.slice().sort((a,b)=>{
    const da = a.date||'9999-99-99', db = b.date||'9999-99-99';
    return da.localeCompare(db);
  });
}
function sortTasks(list){
  return list.slice().sort((a,b)=>{
    const statusRank = s => s==='En ejecución'?0 : s==='Pendiente'?1 : 2;
    const r = statusRank(a.status)-statusRank(b.status);
    if(r!==0) return r;
    const da = a.date||'9999-99-99', db = b.date||'9999-99-99';
    return da.localeCompare(db);
  });
}
function statusClass(status){
  if(status==='Por organizar') return 'status-organizar';
  if(status==='Sin iniciar') return 'status-sin-iniciar';
  if(status==='En ejecución') return 'status-ejecucion';
  if(status==='Pendiente') return 'status-pendiente';
  if(status==='Terminada') return 'status-terminada';
  return '';
}
function renderTaskList(list, showArea, showPostpone, showNotes, showView){
  return list.map(t=>renderTaskCard(t, showArea, showPostpone, showNotes, showView)).join('');
}
function renderTaskCard(t, showArea, showPostpone, showNotes, showView){
  const editing = editingTaskId===('m_'+t.id);
  if(editing) return renderTaskEditCard(t);
  if(viewingTaskId === t.id) return renderTaskViewCard(t);
  const confirmingDelete = pendingDeleteId === t.id;
  const canComplete = (t.status==='Sin iniciar' || t.status==='En ejecución' || t.status==='Pendiente');
  const actions = confirmingDelete
    ? iconAction('complete','check','Confirmar', `data-confirm-delete="${t.id}"`) + iconAction('cancel','x','Cancelar', `data-cancel-delete="1"`)
    : (showView?iconAction('view','view','Ver', `data-view-task="${t.id}"`):'') + iconAction('edit','edit','Editar', `data-edit-matrix="${t.id}"`) + (canComplete?iconAction('complete','check','Completar', `data-complete-matrix="${t.id}"`):'') + (showPostpone?iconAction('postpone','postpone','Aplazar para mañana', `data-postpone="${t.id}"`):'') + iconAction('delete','trash','Eliminar', `data-delete-matrix="${t.id}"`);
  return `
  <div class="task-card ${statusClass(t.status)}">
    <div class="task-top">
      <div>
        <div class="task-name">${escapeHtml(t.name)}</div>
        <div class="task-meta">
          <span class="badge ${statusClass(t.status)}">${t.status}</span>
          ${showArea && t.area?`<span class="badge">${AREA_LABEL[t.area]}</span>`:''}
          ${t.date?`<span>${t.date}</span>`:''}
          ${t.project?` · ${escapeHtml(t.project)}`:''}
        </div>
        ${(showNotes!==false && t.notes)?`<div class="task-notes">${escapeHtml(t.notes)}</div>`:''}
      </div>
      <div class="icon-actions">${actions}</div>
    </div>
  </div>`;
}
function renderTaskViewCard(t){
  const peParts = [];
  if(t.priority) peParts.push('Prioridad: '+t.priority);
  if(t.effort) peParts.push('Esfuerzo: '+t.effort);
  if(t.energy) peParts.push('Energía: '+t.energy);
  return `
  <div class="task-card ${statusClass(t.status)}">
    <div class="task-top">
      <div>
        <div class="task-name">${escapeHtml(t.name)}</div>
        <div class="task-meta">
          <span class="badge ${statusClass(t.status)}">${t.status}</span>
          ${t.area?`<span class="badge">${AREA_LABEL[t.area]}</span>`:''}
          ${t.date?`<span>${t.date}</span>`:''}
        </div>
      </div>
      <div class="icon-actions">${iconAction('cancel','x','Cerrar', `data-close-view="1"`)}</div>
    </div>
    ${peParts.length?`<div class="task-meta" style="margin-top:6px;">${peParts.join(' · ')}</div>`:''}
    ${t.project?`<div class="task-meta" style="margin-top:2px;">Proyecto: ${escapeHtml(t.project)}</div>`:''}
    ${t.notes?`<div class="task-notes" style="margin-top:8px;">${escapeHtml(t.notes)}</div>`:`<div class="empty" style="padding:6px 0 0;">Sin observaciones.</div>`}
  </div>`;
}

// ---------- Interfaz Proyectos ----------
function viewProyectos(){
  let html = `<div class="panel"><h2>Proyectos</h2><div class="status-msg">Toca un proyecto para ver y editar sus actividades.</div></div>`;
  AREAS.forEach(area=>{
    const ps = projectsByArea(area);
    html += `<div class="area-block"><div class="area-title">${AREA_LABEL[area]}</div>`;
    if(ps.length===0){ html += `<div class="empty">Sin proyectos en esta área.</div>`; }
    else{
      ps.forEach(p=>{
        const tks = tasks.filter(t=>t.project===p.name);
        const doneCount = tks.filter(t=>t.status==='Terminada').length;
        const isOpen = expandedProjectId===p.id;
        const isEditing = editingProjectId===p.id;
        const isConfirmingDelete = pendingProjectDeleteId===p.id;

        let headerActions;
        if(isEditing){
          headerActions = iconAction('save','save','Guardar', `data-save-project="${p.id}"`) + iconAction('cancel','x','Cancelar', `data-cancel-edit-project="1"`);
        } else if(isConfirmingDelete){
          headerActions = iconAction('complete','check','Confirmar', `data-confirm-delete-project="${p.id}"`) + iconAction('cancel','x','Cancelar', `data-cancel-delete-project="1"`);
        } else {
          headerActions = iconAction('edit','edit','Renombrar', `data-edit-project="${p.id}"`);
          if(tks.length===0){
            headerActions += iconAction('delete','trash','Eliminar', `data-delete-project="${p.id}"`);
          }
          headerActions += iconAction('list','list', isOpen?'Ocultar':'Actividades', `data-toggle-project="${p.id}"`);
        }

        html += `<div class="task-card">
          <div class="task-top">
            <div style="flex:1;">
              ${isEditing
                ? `<input type="text" id="proj_name_${p.id}" value="${escapeAttr(p.name)}" style="margin-top:0;">
                   <select id="proj_area_${p.id}" style="margin-top:6px;">
                     ${AREAS.map(a=>`<option value="${a}" ${p.area===a?'selected':''}>${AREA_LABEL[a]}</option>`).join('')}
                   </select>`
                : `<div class="task-name">${escapeHtml(p.name)}</div>`}
              <div class="task-meta">${tks.length} tarea(s) · ${doneCount} completada(s)${tks.length===0?' · sin actividades':''}</div>
            </div>
          </div>
          <div class="icon-actions" style="margin-top:8px;">${headerActions}</div>`;
        if(isOpen){
          html += `<div style="margin-top:10px;">`;
          if(tks.length===0) html += `<div class="empty">Este proyecto todavía no tiene actividades.</div>`;
          else html += tks.slice().sort((a,b)=>(a.date||'9999').localeCompare(b.date||'9999')).map(t=>renderTaskCard(t, false)).join('');
          html += `</div>`;
        }
        html += `</div>`;
      });
    }
    html += `</div>`;
  });

  return html;
}

function renderMonthNav(){
  return `
  <div class="panel" style="display:flex;align-items:center;justify-content:space-between;gap:8px;">
    <button type="button" class="icon-btn" data-month-prev="1" title="Mes anterior" aria-label="Mes anterior">◀</button>
    <div style="font-weight:700;font-size:15px;">${monthLabel(gastosViewMonth)}</div>
    <button type="button" class="icon-btn" data-month-next="1" title="Mes siguiente" aria-label="Mes siguiente">▶</button>
  </div>`;
}

function viewGastosResumen(){
  const totalIngresos = gastosIngresos.reduce((s,i)=>s+gastosMonthlyInfo('ingresos',i,gastosViewMonth).real,0);
  const totalFijos = gastosFijos.reduce((s,i)=>s+gastosMonthlyInfo('fijos',i,gastosViewMonth).real,0);
  const totalProvisiones = gastosCiclicos.reduce((s,c)=>s+gastosMonthlyInfo('ciclicos',c,gastosViewMonth).real,0);
  const extraordinariosMes = gastosExtraordinarios.filter(e=>e.status==='Pendiente' && e.date && e.date.slice(0,7)===gastosViewMonth);
  const totalExtraordinarios = extraordinariosMes.reduce((s,e)=>s+Number(e.amount||0),0);
  const today = todayStr();
  const esperaVencidos = gastosEspera.filter(e=>e.status==='Pendiente' && e.date && e.date < today);
  const totalEspera = esperaVencidos.reduce((s,e)=>s+Number(e.amount||0),0);
  const prestamosDelMes = gastosPrestamos.filter(p=>p.date && p.date.slice(0,7)===gastosViewMonth);
  const totalPrestamosSalida = prestamosDelMes.reduce((s,p)=>s+Number(p.amount||0),0);
  const cobrosDelMes = gastosPrestamos.reduce((s,p)=>s + (p.abonos||[]).filter(a=>a.date && a.date.slice(0,7)===gastosViewMonth).reduce((s2,a)=>s2+Number(a.amount||0),0), 0);
  const prestamosPendientes = gastosPrestamos.filter(p=>esperaSaldo(p) > 0);
  const saldoInicial = Number(gastosSaldoInicial[gastosViewMonth]||0);
  const disponible = saldoInicial + totalIngresos + cobrosDelMes - (totalFijos + totalProvisiones + totalExtraordinarios + totalEspera + totalPrestamosSalida);
  const mesCerrado = !!gastosMesesCerrados[gastosViewMonth];

  const ingresosPendientes = gastosIngresos.filter(i=>!(i.paidMonths && i.paidMonths[gastosViewMonth]));
  const fijosPendientes = gastosFijos.filter(i=>!i.isProvision && !(i.paidMonths && i.paidMonths[gastosViewMonth]));
  const ciclicosPendientes = gastosCiclicos.filter(c=>!gastosMonthlyInfo('ciclicos',c,gastosViewMonth).confirmed);

  let html = renderMonthNav();

  const isEditingSaldo = gastosEditingId === 'saldo';
  html += `<div class="panel">
    <h2>Resumen — ${monthLabel(gastosViewMonth)}</h2>
    <div class="status-msg">Los valores usan lo que confirmes/ajustes para este mes; lo que no toques usa el plan.</div>`;
  if(isEditingSaldo){
    html += `<label>Saldo inicial de este mes</label>
    <input type="text" id="gs_saldo_input" value="${saldoInicial}" inputmode="numeric">
    <div class="icon-actions" style="margin-top:8px;">
      ${iconAction('save','save','Guardar', `data-gastos-save-saldo="1"`)}
      ${iconAction('cancel','x','Cancelar', `data-gastos-cancel-edit="1"`)}
    </div>`;
  } else {
    html += `<div class="money-row">
      <span>Saldo inicial (del mes anterior)</span>
      <span style="display:flex;align-items:center;gap:6px;">
        <span class="${saldoInicial>=0?'money-positive':'money-negative'}">${formatCOP(saldoInicial)}</span>
        <button type="button" class="icon-btn" style="width:28px;height:28px;font-size:12px;" data-gastos-edit-saldo="1" title="Ajustar saldo inicial">✏️</button>
      </span>
    </div>`;
  }
  html += `
    <div class="money-row"><span>Ingresos</span><span class="money-positive">${formatCOP(totalIngresos)}</span></div>
    <div class="money-row"><span>Gastos fijos</span><span class="money-negative">-${formatCOP(totalFijos)}</span></div>
    <div class="money-row"><span>Provisiones (cíclicos)</span><span class="money-negative">-${formatCOP(totalProvisiones)}</span></div>
    <div class="money-row"><span>Imprevistos pendientes (${monthLabel(gastosViewMonth)})</span><span class="money-negative">-${formatCOP(totalExtraordinarios)}</span></div>
    <div class="money-row"><span>En espera vencidos (hoy)</span><span class="money-negative">-${formatCOP(totalEspera)}</span></div>
    <div class="money-row"><span>Préstamos hechos (${monthLabel(gastosViewMonth)})</span><span class="money-negative">-${formatCOP(totalPrestamosSalida)}</span></div>
    <div class="money-row"><span>Cobros de préstamos (${monthLabel(gastosViewMonth)})</span><span class="money-positive">+${formatCOP(cobrosDelMes)}</span></div>
    <div class="money-row total"><span>Dinero disponible</span><span class="${disponible>=0?'money-positive':'money-negative'}">${formatCOP(disponible)}</span></div>
  </div>`;

  html += `<div class="panel">
    ${mesCerrado ? `<div class="status-msg">✅ Este mes está cerrado. Su disponible ya pasó como saldo inicial de ${monthLabel(addMonths(gastosViewMonth,1))}.</div>` : `<div class="status-msg">Cuando termines de revisar este mes, ciérralo para pasar el disponible como saldo inicial de ${monthLabel(addMonths(gastosViewMonth,1))}. No pasa nada solo, tienes que cerrarlo tú.</div>`}
    <button type="button" class="${mesCerrado?'secondary':'primary'}" data-gastos-cerrar-mes="1" style="width:100%;">${mesCerrado?'🔒 Volver a cerrar (recalcular)':'🔒 Cerrar '+monthLabel(gastosViewMonth)}</button>
  </div>`;

  if(fijosPendientes.length || ciclicosPendientes.length || extraordinariosMes.length || esperaVencidos.length){
    html += `<div class="panel"><h2>🔔 Pendiente por pagar</h2>`;
    fijosPendientes.forEach(i=>{
      const info = gastosMonthlyInfo('fijos', i, gastosViewMonth);
      html += renderGastosPendingRow(i.name, info.plan);
    });
    ciclicosPendientes.forEach(c=>{
      const info = gastosMonthlyInfo('ciclicos', c, gastosViewMonth);
      html += renderGastosPendingRow(c.name+' (provisión)', info.plan);
    });
    extraordinariosMes.forEach(e=>{
      html += renderGastosPendingRow(e.name, e.amount);
    });
    esperaVencidos.forEach(e=>{
      html += renderGastosPendingRow(e.name+' (vencido desde '+e.date+')', e.amount);
    });
    html += `</div>`;
  }
  if(ingresosPendientes.length || prestamosPendientes.length){
    html += `<div class="panel"><h2>🔔 Pendiente por cobrar</h2>`;
    ingresosPendientes.forEach(i=>{
      const info = gastosMonthlyInfo('ingresos', i, gastosViewMonth);
      html += renderGastosPendingRow(i.name, info.plan);
    });
    prestamosPendientes.forEach(p=>{
      html += renderGastosPendingRow(p.name+' (préstamo)', esperaSaldo(p));
    });
    html += `</div>`;
  }

  if(extraordinariosMes.length){
    html += `<div class="panel"><h2>Imprevistos de ${monthLabel(gastosViewMonth)}</h2>`;
    extraordinariosMes.forEach(e=>{
      html += `<div class="task-card"><div class="task-top"><div class="task-name">${escapeHtml(e.name)}</div><div class="task-name">${formatCOP(e.amount)}</div></div></div>`;
    });
    html += `</div>`;
  }
  if(esperaVencidos.length){
    html += `<div class="panel"><h2>En espera vencidos</h2>`;
    esperaVencidos.forEach(e=>{
      html += `<div class="task-card status-organizar"><div class="task-top"><div class="task-name">${escapeHtml(e.name)}</div><div class="task-name">${formatCOP(e.amount)}</div></div><div class="task-meta">Vencido: ${e.date}</div></div>`;
    });
    html += `</div>`;
  }
  return html;
}

function gastosProvisionSpent(item, month){
  const txs = (item.transactions && item.transactions[month]) || [];

}

function renderGastosPendingRow(name, amount){
  return `<div class="task-card status-organizar">
    <div class="task-top">
      <div class="task-name">${escapeHtml(name)}</div>
      <div class="task-name">${formatCOP(amount)}</div>
    </div>
  </div>`;
}
function gastosMonthlyInfo(cat, item, month){
  if(cat==='ciclicos'){
    const plan = Number(item.totalAmount||0)/Math.max(1,Number(item.periodMonths||1));
    const contrib = (item.contributions && item.contributions[month]!==undefined) ? item.contributions[month] : null;
    return { plan, real: contrib!==null?contrib:plan, confirmed: contrib!==null };
  }
  if(cat==='fijos' && item.isProvision){
    const plan = Number(item.amount||0);
    return { plan, real: gastosProvisionSpent(item, month), confirmed: true };
  }
  const plan = Number(item.amount||0);
  const ov = (item.overrides && item.overrides[month]!==undefined) ? item.overrides[month] : null;
  return { plan, real: ov!==null?ov:plan, confirmed: ov!==null };
}
function gastosSetMonthly(cat, item, month, value){
  if(cat==='ciclicos'){
    if(!item.contributions) item.contributions = {};
    item.contributions[month] = value;
  } else {
    if(!item.overrides) item.overrides = {};
    item.overrides[month] = value;
  }
}
function gastosResetMonthly(cat, item, month){
  if(cat==='ciclicos'){
    if(item.contributions) delete item.contributions[month];
  } else {
    if(item.overrides) delete item.overrides[month];
  }
}
function ciclicoAccumulated(c){
  const contrib = c.contributions || {};
  let sum = Object.values(contrib).reduce((s,v)=>s+Number(v||0),0);
  if((!c.contributions || Object.keys(c.contributions).length===0) && c.accumulated){
    sum += Number(c.accumulated||0);
  }
  return sum;
}
function renderGastosReconcileItem(cat, item){
  const key = cat+':'+item.id;
  const info = gastosMonthlyInfo(cat, item, gastosViewMonth);
  const isEditing = gastosEditingId === ('reconcile:'+key);
  if(isEditing){
    return `<div class="task-card">
      <div class="task-name">${escapeHtml(item.name)}</div>
      <label>Real este mes (plan: ${formatCOP(info.plan)})</label>
      <input type="text" id="gs_recon_amount_${item.id}" value="${info.real}" inputmode="numeric">
      <div class="icon-actions" style="margin-top:8px;">
        ${iconAction('save','save','Guardar', `data-gastos-reconcile-save="${key}"`)}
        ${iconAction('cancel','x','Cancelar', `data-gastos-cancel-edit="1"`)}
      </div>
    </div>`;
  }
  let actions = iconAction('edit','edit','Ajustar', `data-gastos-reconcile-edit="${key}"`);
  actions += info.confirmed
    ? iconAction('cancel','x','Volver al plan', `data-gastos-reconcile-reset="${key}"`)
    : iconAction('complete','check','Confirmar', `data-gastos-reconcile-confirm="${key}"`);
  const diff = info.real - info.plan;
  let varianceHtml = '';
  if(info.confirmed && diff !== 0){
    const isIncome = cat==='ingresos';
    const good = isIncome ? diff>0 : diff<0;
    varianceHtml = `<div class="task-meta" style="margin-top:2px;"><span class="${good?'money-positive':'money-negative'}">${diff>0?'+':''}${formatCOP(diff)} vs. plan</span></div>`;
  }
  return `<div class="task-card ${info.confirmed?'status-terminada':'status-sin-iniciar'}">
    <div class="task-top">
      <div>
        <div class="task-name">${escapeHtml(item.name)}</div>
        <div class="task-meta">Plan: ${formatCOP(info.plan)} · <span class="badge ${info.confirmed?'status-terminada':'status-sin-iniciar'}">${info.confirmed?'Confirmado':'Usando plan'}</span></div>
        ${varianceHtml}
      </div>
      <div class="task-name">${formatCOP(info.real)}</div>
    </div>
    <div class="icon-actions" style="margin-top:8px;">${actions}</div>
  </div>`;
}
async function onGastosReconcileConfirm(key){
  const [cat,id] = key.split(':');
  const item = gastosListFor(cat).find(x=>x.id===id);
  if(!item) return;
  const info = gastosMonthlyInfo(cat, item, gastosViewMonth);
  gastosSetMonthly(cat, item, gastosViewMonth, info.plan);
  await saveGastos(cat);
  render();
}
async function onGastosReconcileReset(key){
  const [cat,id] = key.split(':');
  const item = gastosListFor(cat).find(x=>x.id===id);
  if(!item) return;
  gastosResetMonthly(cat, item, gastosViewMonth);
  await saveGastos(cat);
  render();
}
async function onGastosReconcileSave(key){
  const [cat,id] = key.split(':');
  const item = gastosListFor(cat).find(x=>x.id===id);
  if(!item) return;
  const val = parseMoney(document.getElementById('gs_recon_amount_'+id).value);

async function onGastosInlineAmount(key, value){
  const [cat,id] = key.split(':');
  const item = gastosListFor(cat).find(x=>x.id===id);
  if(!item) return;
  const val = parseMoney(value);
  gastosSetMonthly(cat, item, gastosViewMonth, val);
  await saveGastos(cat);
  render();
}
async function onGastosTogglePaid(key){
  const [cat,id] = key.split(':');
  const item = gastosListFor(cat).find(x=>x.id===id);
  if(!item) return;
  if(!item.paidMonths) item.paidMonths = {};
  if(item.paidMonths[gastosViewMonth]) delete item.paidMonths[gastosViewMonth];
  else item.paidMonths[gastosViewMonth] = true;
  await saveGastos(cat);
  render();
}

async function onGastosProvisionAdd(id){
  const item = gastosFijos.find(x=>x.id===id);
  if(!item) return;
  const descEl = document.getElementById('gs_prov_desc_'+id);
  const amountEl = document.getElementById('gs_prov_amount_'+id);
  const desc = (descEl && descEl.value.trim()) ? descEl.value.trim() : item.name;
  const amount = parseMoney(amountEl.value);
  if(amount<=0){ alert('El monto debe ser mayor a cero.'); return; }
  if(!item.transactions) item.transactions = {};
  if(!item.transactions[gastosViewMonth]) item.transactions[gastosViewMonth] = [];
  item.transactions[gastosViewMonth].push({ id:uid(), desc, amount, date: todayStr() });
  gastosEditingId = null;
  await saveGastos('fijos');
  render();
}
async function onGastosProvisionDeleteTx(key){
  const [cat, id, txId] = key.split(':');
  const item = gastosListFor(cat).find(x=>x.id===id);
  if(!item || !item.transactions || !item.transactions[gastosViewMonth]) return;
  item.transactions[gastosViewMonth] = item.transactions[gastosViewMonth].filter(t=>t.id!==txId);
  await saveGastos(cat);
  render();
}

async function onGastosAbonoAdd(key){
  const [cat, id] = key.split(':');
  const item = gastosListFor(cat).find(x=>x.id===id);
  if(!item) return;
  const amountEl = document.getElementById('gs_abono_amount_'+id);

  item.abonos.push({ id:uid(), amount, date: todayStr() });
  item.status = esperaSaldo(item) <= 0 ? 'Pagado' : 'Pendiente';
  gastosEditingId = null;
  await saveGastos(cat);
  render();
}
async function onGastosAbonoDelete(key){
  const [cat, id, abonoId] = key.split(':');
  const item = gastosListFor(cat).find(x=>x.id===id);
  if(!item || !item.abonos) return;
  item.abonos = item.abonos.filter(a=>a.id!==abonoId);
  item.status = esperaSaldo(item) <= 0 ? 'Pagado' : 'Pendiente';
  await saveGastos(cat);
  render();
}

async function onGastosCerrarMes(){
  const month = gastosViewMonth;
  const totalIngresos = gastosIngresos.reduce((s,i)=>s+gastosMonthlyInfo('ingresos',i,month).real,0);
  const totalFijos = gastosFijos.reduce((s,i)=>s+gastosMonthlyInfo('fijos',i,month).real,0);
  const totalProvisiones = gastosCiclicos.reduce((s,c)=>s+gastosMonthlyInfo('ciclicos',c,month).real,0);
  const extraordinariosMes = gastosExtraordinarios.filter(e=>e.status==='Pendiente' && e.date && e.date.slice(0,7)===month);
  const totalExtraordinarios = extraordinariosMes.reduce((s,e)=>s+Number(e.amount||0),0);
  const today = todayStr();
  const esperaVencidos = gastosEspera.filter(e=>e.status==='Pendiente' && e.date && e.date < today);
  const totalEspera = esperaVencidos.reduce((s,e)=>s+Number(e.amount||0),0);
  const saldoInicial = Number(gastosSaldoInicial[month]||0);
  const disponible = saldoInicial + totalIngresos - (totalFijos + totalProvisiones + totalExtraordinarios + totalEspera);

  const nextMonth = addMonths(month, 1);
  gastosSaldoInicial[nextMonth] = disponible;
  gastosMesesCerrados[month] = true;
  await saveGastosSaldo();
  render();
  alert('Mes cerrado. '+formatCOP(disponible)+' quedó como saldo inicial de '+monthLabel(nextMonth)+'.');
}

function esperaAbonado(item){
  return (item.abonos||[]).reduce((s,a)=>s+Number(a.amount||0),0);
}
function esperaSaldo(item){
  return Number(item.amount||0) - esperaAbonado(item);
}

function renderGastosDeudaItem(cat, item, labels){
  const key = cat+':'+item.id;
  const isEditing = gastosEditingId===key;
  const isConfirmingDelete = gastosPendingDeleteId===key;
  const isAbonando = gastosEditingId === ('abono:'+cat+':'+item.id);

  if(isEditing){
    return `<div class="task-card">
      <label>Nombre</label>
      <input type="text" id="gs_edit_name_${item.id}" value="${escapeAttr(item.name)}">
      <label>${labels.montoLabel}</label>
      <input type="text" id="gs_edit_amount_${item.id}" value="${item.amount}" inputmode="numeric">
      <label>Fecha</label>
      <input type="date" id="gs_edit_date_${item.id}" value="${item.date||''}">
      <div class="icon-actions" style="margin-top:8px;">
        ${iconAction('save','save','Guardar', `data-gastos-save="${key}"`)}
        ${iconAction('cancel','x','Cancelar', `data-gastos-cancel-edit="1"`)}
      </div>
    </div>`;
  }

  const total = Number(item.amount||0);
  const abonado = esperaAbonado(item);
  const saldo = esperaSaldo(item);
  const pct = total>0 ? Math.min(100, Math.round((abonado/total)*100)) : 0;
  const pagado = saldo <= 0;
  const isVencido = !pagado && item.date && item.date < todayStr();
  const abonos = (item.abonos||[]).slice().sort((a,b)=>(b.date||'').localeCompare(a.date||''));

  let actions;
  if(isConfirmingDelete){
    actions = iconAction('complete','check','Confirmar', `data-gastos-confirm-delete="${key}"`) + iconAction('cancel','x','Cancelar', `data-gastos-cancel-delete="1"`);
  } else {
    actions = iconAction('edit','edit','Editar', `data-gastos-edit="${key}"`);
    if(!pagado) actions += `<button type="button" class="icon-btn" title="${labels.accionLabel}" aria-label="${labels.accionLabel}" data-gastos-abono-open="${cat}:${item.id}">${labels.icono}</button>`;
    actions += iconAction('delete','trash','Eliminar', `data-gastos-delete="${key}"`);
  }

  const abonoFormHtml = isAbonando ? `
    <div style="margin-top:8px;">
      <label>Monto</label>
      <input type="text" id="gs_abono_amount_${item.id}" placeholder="Monto" inputmode="numeric">
      <div class="icon-actions" style="margin-top:8px;">
        ${iconAction('save','save','Agregar', `data-gastos-abono-add="${cat}:${item.id}"`)}
        ${iconAction('cancel','x','Cancelar', `data-gastos-cancel-edit="1"`)}
      </div>
    </div>` : '';

  const abonosListHtml = abonos.length ? abonos.map(a=>`
    <div class="task-card" style="padding:8px 10px;">
      <div class="task-top">
        <div class="task-name" style="font-size:12.5px;">${a.date}</div>
        <div style="display:flex;align-items:center;gap:6px;">
          <div class="task-name" style="font-size:12.5px;">${formatCOP(a.amount)}</div>
          <button type="button" class="icon-btn" style="width:28px;height:28px;font-size:12px;" data-gastos-abono-delete="${cat}:${item.id}:${a.id}" title="Eliminar">🗑️</button>
        </div>
      </div>
    </div>`).join('') : '';

  return `<div class="task-card ${pagado?'status-terminada':(isVencido?'status-organizar':'status-sin-iniciar')}">
    <div class="task-top">
      <div>
        <div class="task-name">${escapeHtml(item.name)}</div>
        <div class="task-meta">
          <span class="badge ${pagado?'status-terminada':(isVencido?'status-organizar':'status-sin-iniciar')}">${pagado?'Pagado':(isVencido?'Vencido':'Pendiente')}</span>
          ${item.date?`<span>${item.date}</span>`:''}
        </div>
      </div>
      <div class="task-name">${formatCOP(total)}</div>
    </div>
    <div class="progress-track"><div class="progress-fill" style="width:${pct}%;"></div></div>
    <div class="task-meta" style="margin-top:4px;">${labels.abonadoLabel}: ${formatCOP(abonado)} · Saldo: ${formatCOP(saldo)}</div>
    <div class="icon-actions" style="margin-top:8px;">${actions}</div>
    ${abonoFormHtml}
    ${abonosListHtml ? `<div style="margin-top:8px;">${abonosListHtml}</div>` : ''}
  </div>`;
}

function viewGastosDia(){
  const today = todayStr();
  const todayDay = new Date().getDate();
  const mesActual = currentMonthStr();
  let html = `<div class="panel"><h2>Pagos por hacer</h2><div class="status-msg">Lo que vence hoy, y todo lo demás que sigue pendiente de pagar.</div></div>`;

  const fijosHoy = gastosFijos.filter(i=>!i.isProvision && i.dueDay===todayDay);
  const ciclicosHoy = gastosCiclicos.filter(c=>c.nextDueDate===today);
  const imprevistosHoy = gastosExtraordinarios.filter(e=>e.status==='Pendiente' && e.date===today);
  const esperaVencidosHoy = gastosEspera.filter(e=>e.status==='Pendiente' && e.date && e.date < today);

  const anyHoy = fijosHoy.length || ciclicosHoy.length || imprevistosHoy.length || esperaVencidosHoy.length;
  html += `<div class="panel"><h2>🔴 Vence hoy</h2>`;
  if(!anyHoy){
    html += `<div class="empty">Nada vence hoy.</div>`;
  } else {
    fijosHoy.forEach(i=>{ html += renderGastosPendingRow('📌 '+i.name, i.amount); });
    ciclicosHoy.forEach(c=>{
      const provision = Number(c.totalAmount||0)/Math.max(1,Number(c.periodMonths||1));
      html += renderGastosPendingRow('🐷 '+c.name, provision);
    });
    imprevistosHoy.forEach(e=>{ html += renderGastosPendingRow('⚡ '+e.name, e.amount); });
    esperaVencidosHoy.forEach(e=>{ html += renderGastosPendingRow('⏳ '+e.name+' (vencido desde '+e.date+')', esperaSaldo(e)); });
  }
  html += `</div>`;

  const fijosPend = gastosFijos.filter(i=>!i.isProvision && !fijosHoy.includes(i) && !(i.paidMonths && i.paidMonths[mesActual]));
  const ciclicosPend = gastosCiclicos.filter(c=>!ciclicosHoy.includes(c) && !(c.contributions && c.contributions[mesActual]!==undefined));
  const imprevistosPend = gastosExtraordinarios.filter(e=>e.status==='Pendiente' && !imprevistosHoy.includes(e));
  const esperaPend = gastosEspera.filter(e=>e.status==='Pendiente' && !esperaVencidosHoy.includes(e) && esperaSaldo(e)>0);

  const anyPend = fijosPend.length || ciclicosPend.length || imprevistosPend.length || esperaPend.length;
  html += `<div class="panel"><h2>🟡 Otros pendientes</h2>`;
  if(!anyPend){
    html += `<div class="empty">No tienes más pagos pendientes.</div>`;
  } else {
    fijosPend.forEach(i=>{ html += renderGastosPendingRow('📌 '+i.name+(i.dueDay?` (vence el ${i.dueDay})`:''), i.amount); });
    ciclicosPend.forEach(c=>{
      const provision = Number(c.totalAmount||0)/Math.max(1,Number(c.periodMonths||1));
      html += renderGastosPendingRow('🐷 '+c.name+(c.nextDueDate?` (próx. ${c.nextDueDate})`:''), provision);
    });
    imprevistosPend.forEach(e=>{ html += renderGastosPendingRow('⚡ '+e.name+(e.date?` (${e.date})`:''), e.amount); });
    esperaPend.forEach(e=>{ html += renderGastosPendingRow('⏳ '+e.name+(e.date?` (vence ${e.date})`:''), esperaSaldo(e)); });
  }
  html += `</div>`;

  return html;
}

    </div>`;
  }
  const total = Number(c.totalAmount||0);
  const acumulado = ciclicoAccumulated(c);
  const provision = total/Math.max(1,Number(c.periodMonths||1));
  const pct = total>0 ? Math.min(100, Math.round((acumulado/total)*100)) : 0;
  const yaAporto = !!(c.contributions && c.contributions[gastosViewMonth]!==undefined);
  const completo = acumulado >= total && total>0;

  let actions;
  if(isConfirmingDelete){
    actions = iconAction('complete','check','Confirmar', `data-gastos-confirm-delete="${key}"`) + iconAction('cancel','x','Cancelar', `data-gastos-cancel-delete="1"`);
  } else {
    actions = iconAction('edit','edit','Editar', `data-gastos-edit="${key}"`);

  return `<div class="task-card">

    <div class="task-meta" style="margin-top:4px;">${formatCOP(acumulado)} de ${formatCOP(total)} (${pct}%)${completo?' · ¡completo!':''}</div>

  </div>`;
}

  <div class="panel">
    <h2>Exportar a Excel</h2>
    <div class="status-msg">Descarga todas las tareas en un archivo .xlsx, en una sola hoja.</div>
    <button class="primary" id="btn_export_excel" style="width:100%;">⬇️ Exportar a Excel</button>
  </div>
  <div class="panel">
    <h2>Importar desde Excel</h2>
    ${importConfirmPending ? `
      <div class="status-msg">⚠️ Vas a reemplazar <strong>todas</strong> las tareas actuales por ${importRows} tarea(s) del texto pegado. Esta acción no se puede deshacer. ¿Confirmas?</div>
      <div class="task-actions">
        <button class="danger" data-confirm-import="1">Sí, reemplazar todo</button>
        <button class="secondary" data-cancel-import="1">Cancelar</button>
      </div>
    ` : `
      <div class="status-msg">⚠️ Importar reemplaza <strong>todas</strong> las tareas actuales por las de este archivo. Copia un rango de Excel que incluya como primera fila estos encabezados: ${DATA_COLUMNS.join(', ')}. Pégalo abajo y presiona Importar.</div>
      <label>Pega aquí el rango copiado de Excel</label>
      <textarea id="import_paste" rows="6" placeholder="Pega aquí (Ctrl+V) el rango copiado de Excel...">${escapeHtml(pendingImportText)}</textarea>
      <button class="primary" id="btn_import_excel" style="width:100%;margin-top:10px;">⬆️ Importar tareas pegadas</button>
    `}
  </div>
  ${importWarnings.length ? `
  <div class="panel">
    <h2>⚠️ Avisos de la última importación (${importWarnings.length})</h2>
    <div class="status-msg">Estas filas no cumplían el formato esperado; se importaron igual, dejando el campo en blanco (o con el valor por defecto indicado).</div>
    ${importWarnings.map(w=>`<div class="task-notes" style="margin-bottom:6px;">${escapeHtml(w)}</div>`).join('')}
    <button class="secondary" data-dismiss-warnings="1" style="margin-top:8px;">Cerrar avisos</button>
  </div>` : ''}`;
}
function countImportRows(raw){
  const lines = (raw||'').split(/\r?\n/).filter(l=>l.trim().length>0);
  return Math.max(0, lines.length - 1);
}

function exportExcel(){
  if(typeof XLSX === 'undefined'){
    alert('No se pudo cargar la librería de Excel. Verifica tu conexión a internet e intenta de nuevo.');
    return;
  }
  const rows = tasks.map(t=>({
    'Nombre': t.name||'',
    'Área': t.area?AREA_LABEL[t.area]:'',
    'Prioridad': t.priority||'',
    'Esfuerzo': t.effort||'',
    'Energía': t.energy||'',
    'Fecha': t.date||'',
    'Estado': t.status||'',
    'Proyecto': t.project||'',
    'Observaciones': t.notes||'',
    'Fecha completada': t.completedDate||'',
  }));
  const ws = XLSX.utils.json_to_sheet(rows, {header: DATA_COLUMNS});
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, 'Tareas');
  XLSX.writeFile(wb, 'tareas_'+todayStr()+'.xlsx');
}

function requestImport(){
  const textarea = document.getElementById('import_paste');
  const raw = textarea ? textarea.value : '';
  if(!raw.trim()){ alert('Pega los datos copiados de Excel primero.'); return; }
  pendingImportText = raw;
  importConfirmPending = true;
  render();
}

async function runImport(){
  const raw = pendingImportText;
  const lines = raw.split(/\r?\n/).filter(l=>l.trim().length>0);
  if(lines.length<2){ alert('No se encontraron filas de datos debajo del encabezado.'); importConfirmPending=false; render(); return; }
  const headers = lines[0].split('\t').map(h=>h.trim());
  const newTasks = [];
  const warnings = [];
  for(let i=1;i<lines.length;i++){
    const filaNum = i+1;
    const cells = lines[i].split('\t');
    const row = {};
    headers.forEach((h,idx)=> row[h] = (cells[idx]||'').trim());
    const name = row['Nombre'];
    if(!name) continue;

    const areaLabel = row['Área'];
    let area = null;
    if(areaLabel){
      for(const k of AREAS){ if(AREA_LABEL[k]===areaLabel || k===areaLabel){ area=k; break; } }
      if(!area) warnings.push(`Fila ${filaNum} ("${name}"): el área "${areaLabel}" no es válida. Debe ser una de: ${AREAS.map(a=>AREA_LABEL[a]).join(', ')}. Se dejó en blanco.`);
    }

    let priority = null;
    if(row['Prioridad']){
      priority = PRIORITIES.includes(row['Prioridad']) ? row['Prioridad'] : null;
      if(!priority) warnings.push(`Fila ${filaNum} ("${name}"): la prioridad "${row['Prioridad']}" no es válida. Debe ser una de: ${PRIORITIES.join(', ')}. Se dejó en blanco.`);
    }

    let effort = null;
    if(row['Esfuerzo']){
      effort = EFFORTS.includes(row['Esfuerzo']) ? row['Esfuerzo'] : null;
      if(!effort) warnings.push(`Fila ${filaNum} ("${name}"): el esfuerzo "${row['Esfuerzo']}" no es válido. Debe ser uno de: ${EFFORTS.join(', ')}. Se dejó en blanco.`);
    }

    let energy = null;
    if(row['Energía']){
      energy = ENERGIES.includes(row['Energía']) ? row['Energía'] : null;
      if(!energy) warnings.push(`Fila ${filaNum} ("${name}"): la energía "${row['Energía']}" no es válida. Debe ser una de: ${ENERGIES.join(', ')}. Se dejó en blanco.`);
    }

    let date = null;
    if(row['Fecha']){
      date = /^\d{4}-\d{2}-\d{2}$/.test(row['Fecha']) ? row['Fecha'] : null;
      if(!date) warnings.push(`Fila ${filaNum} ("${name}"): la fecha "${row['Fecha']}" no tiene el formato válido. Debe ser AAAA-MM-DD (ejemplo: 2026-07-21). Se dejó en blanco.`);
    }

    let status = 'Por organizar';
    if(row['Estado']){
      if(STATUSES.includes(row['Estado'])){
        status = row['Estado'];
      } else {
        warnings.push(`Fila ${filaNum} ("${name}"): el estado "${row['Estado']}" no es válido. Debe ser uno de: ${STATUSES.join(', ')}. Se usó "Por organizar".`);
      }
    }

    const notes = row['Observaciones'] || '';

    let completedDate = null;
    if(row['Fecha completada']){
      completedDate = /^\d{4}-\d{2}-\d{2}$/.test(row['Fecha completada']) ? row['Fecha completada'] : null;
      if(!completedDate) warnings.push(`Fila ${filaNum} ("${name}"): la fecha completada "${row['Fecha completada']}" no tiene el formato válido. Debe ser AAAA-MM-DD. Se dejó en blanco.`);
    }

    const projectName = row['Proyecto'];
    let project = null;
    if(projectName){
      project = getOrCreateProject(projectName, area);
      if(project.area) area = project.area;
    }

    newTasks.push({
      id: uid(), name, area, priority, effort, energy, date, status,
      project: project?project.name:null, notes, completedDate, createdAt: Date.now(),
    });
  }
  tasks = newTasks;
  await saveTasks();
  await saveProjects();
  pendingImportText = '';
  importConfirmPending = false;
  importWarnings = warnings;
  render();
  if(warnings.length===0){
    alert(tasks.length + ' tarea(s) importada(s). Se reemplazaron todas las tareas anteriores.');
  }
}

async function onCrearTarea(area){
  const nameInput = document.getElementById('c_name_'+area);
  const raw = nameInput.value;
  const lines = raw.split(/\r?\n/).map(l=>l.trim()).filter(l=>l.length>0);
  if(lines.length===0){ nameInput.focus(); return; }
  lines.forEach(name=>{
    tasks.push({
      id: uid(),
      name,
      area: area,
      date: null,
      priority: null,
      effort: null,
      energy: null,
      project: null,
      notes: '',
      status: 'Por organizar',
      completedDate: null,
      createdAt: Date.now(),
    });
  });
  await saveTasks();
  nameInput.value='';
  nameInput.style.height='';
  nameInput.focus();
}

async function onSaveOrganize(id){
  const isNew = (id === '__new__');
  let t = isNew ? null : tasks.find(x=>x.id===id);
  if(!isNew && !t) return;

  const name = document.getElementById('d_name').value.trim();
  const area = document.getElementById('d_area').value || null;
  const date = document.getElementById('d_date').value || null;
  const priority = document.getElementById('d_priority').value || null;
  const effort = document.getElementById('d_effort').value || null;
  const energy = document.getElementById('d_energy').value || null;
  const notes = document.getElementById('d_notes').value || '';

  const faltantes = [];
  if(!name) faltantes.push('nombre');
  if(!area) faltantes.push('área');
  if(!date) faltantes.push('fecha');
  if(!priority) faltantes.push('prioridad');
  if(!effort) faltantes.push('esfuerzo');
  if(!energy) faltantes.push('energía');
  if(faltantes.length){
    alert('Falta completar: ' + faltantes.join(', ') + '. Todos los campos son obligatorios, excepto proyecto y observaciones.');
    return;
  }

  const projectName = document.getElementById('d_project').value.trim();
  let project = null;
  if(projectName){
    const existing = projects.find(p=>p.name.toLowerCase()===projectName.toLowerCase());
    if(existing){
      if(existing.area && existing.area !== area){
        alert(`El proyecto "${existing.name}" pertenece al área ${AREA_LABEL[existing.area]}, pero elegiste ${AREA_LABEL[area]} para esta tarea. Ajusta el área de la tarea o elige otro proyecto.`);
        return;
      }
      project = existing;
    } else {
      project = getOrCreateProject(projectName, area);
    }
  }

  if(isNew){
    t = {
      id: uid(), name, area, date, priority, effort, energy,
      project: project?project.name:null, notes, status:'Sin iniciar',
      completedDate:null, createdAt: Date.now(),
    };
    tasks.push(t);
  } else {
    t.name = name;
    t.area = area;
    t.date = date;
    t.priority = priority;
    t.effort = effort;
    t.energy = energy;
    t.project = project ? project.name : null;
    t.notes = notes;
    t.status = 'Sin iniciar';
  }
  await saveTasks();
  await saveProjects();
  editingTaskId = null;
  render();
}

async function onSaveMatrix(id){
  const t = tasks.find(x=>x.id===id);
  if(!t) return;
  const newName = document.getElementById('m_name_'+id).value.trim() || t.name;
  const newDate = document.getElementById('m_date_'+id).value || null;
  let projectName = document.getElementById('m_project_'+id).value.trim();
  let project = null;
  if(projectName){
    const existing = projects.find(p=>p.name.toLowerCase()===projectName.toLowerCase());
    if(existing){
      if(existing.area && existing.area !== t.area){
        alert(`El proyecto "${existing.name}" pertenece al área ${AREA_LABEL[existing.area]}, pero esta tarea es de ${AREA_LABEL[t.area]}. Ajusta el proyecto o cambia el área de la tarea desde "Organizar tareas".`);
        return;
      }
      project = existing;
    } else {
      project = getOrCreateProject(projectName, t.area);
    }
  }
  t.name = newName;
  t.date = newDate;
  t.project = project ? project.name : null;
  t.priority = document.getElementById('m_priority_'+id).value || null;
  t.effort = document.getElementById('m_effort_'+id).value || null;
  t.energy = document.getElementById('m_energy_'+id).value || null;
  t.status = document.getElementById('m_status_'+id).value;
  const notesEl = document.getElementById('m_notes_'+id);
  t.notes = notesEl ? notesEl.value : (t.notes||'');
  await saveTasks();
  await saveProjects();
  editingTaskId = null;
  render();
}

async function onSaveProjectName(id){
  const p = projects.find(x=>x.id===id);
  if(!p) return;
  const input = document.getElementById('proj_name_'+id);
  const areaSelect = document.getElementById('proj_area_'+id);
  const newName = input ? input.value.trim() : '';
  const newArea = areaSelect ? areaSelect.value : p.area;
  if(!newName){ alert('El nombre del proyecto no puede estar vacío.'); return; }
  const oldName = p.name;
  const oldArea = p.area;
  if(newName !== oldName){
    const clash = projects.find(x=>x.id!==id && x.name.toLowerCase()===newName.toLowerCase() && x.area===newArea);
    if(clash){ alert('Ya existe un proyecto con ese nombre en esta área.'); return; }
  }
  p.name = newName;
  p.area = newArea;
  tasks.forEach(t=>{
    if(t.project === oldName){
      t.project = newName;
      if(newArea !== oldArea) t.area = newArea;
    }
  });
  await saveTasks();
  await saveProjects();
  editingProjectId = null;
  render();
}

async function onDeleteProject(id){
  const p = projects.find(x=>x.id===id);
  if(!p) return;
  const stillHasTasks = tasks.some(t=>t.project===p.name);
  if(stillHasTasks){
    alert('Este proyecto todavía tiene actividades asociadas, no se puede eliminar.');
    pendingProjectDeleteId = null;
    render();
    return;
  }
  projects = projects.filter(x=>x.id!==id);
  pendingProjectDeleteId = null;
  await saveProjects();
  render();
}

// ---------- Lógica del módulo Gastos ----------
function gastosListFor(cat){
  if(cat==='ingresos') return gastosIngresos;
  if(cat==='fijos') return gastosFijos;
  if(cat==='ciclicos') return gastosCiclicos;
  if(cat==='extraordinarios') return gastosExtraordinarios;
  if(cat==='espera') return gastosEspera;
  if(cat==='prestamos') return gastosPrestamos;
  return [];
}
function parseMoney(v){
  const n = Number(String(v||'').replace(/[^0-9.-]/g,''));
  return isNaN(n) ? 0 : n;
}

async function onGastosAdd(cat){
  const name = (document.getElementById('gs_new_name_'+cat).value||'').trim();
  if(!name){ alert('Escribe un nombre.'); return; }
  const amount = parseMoney(document.getElementById('gs_new_amount_'+cat).value);
  if(amount<=0){ alert('El monto debe ser mayor a cero.'); return; }

  if(cat==='ciclicos'){
    const period = parseInt(document.getElementById('gs_new_period_ciclicos').value, 10);
    const date = document.getElementById('gs_new_date_ciclicos').value || null;
    if(!period || period<1){ alert('Indica cada cuántos meses se repite (ej. 6).'); return; }
    gastosCiclicos.push({ id:uid(), name, totalAmount:amount, periodMonths:period, nextDueDate:date, contributions:{} });
    await saveGastos('ciclicos');
  } else if(cat==='extraordinarios' || cat==='espera' || cat==='prestamos'){
    const date = document.getElementById('gs_new_date_'+cat).value || null;
    if((cat==='extraordinarios' || cat==='prestamos') && !date){ alert('Indica la fecha.'); return; }
    gastosListFor(cat).push({ id:uid(), name, amount, date, status:'Pendiente', abonos:[] });
    await saveGastos(cat);
  } else {
    const isProvision = cat==='fijos' && !!document.getElementById('gs_new_isprovision_fijos') && document.getElementById('gs_new_isprovision_fijos').checked;
    const newItem = { id:uid(), name, amount, overrides:{}, paidMonths:{} };
    if(isProvision){ newItem.isProvision = true; newItem.transactions = {}; }
    if(cat==='fijos'){
      const dueDayEl = document.getElementById('gs_new_dueday_fijos');
      const dueDay = dueDayEl ? parseInt(dueDayEl.value,10) : NaN;
      if(dueDay>=1 && dueDay<=31) newItem.dueDay = dueDay;
    }
    gastosListFor(cat).push(newItem);
    await saveGastos(cat);
  }

  document.getElementById('gs_new_name_'+cat).value='';
  const amountEl = document.getElementById('gs_new_amount_'+cat);
  if(amountEl) amountEl.value='';
  const dateEl = document.getElementById('gs_new_date_'+cat);
  if(dateEl) dateEl.value='';
  const periodEl = document.getElementById('gs_new_period_'+cat);
  if(periodEl) periodEl.value='';
  render();
}

async function onGastosSaveEdit(key){
  const [cat, id] = key.split(':');
  const list = gastosListFor(cat);
  const item = list.find(x=>x.id===id);
  if(!item) return;
  const name = (document.getElementById('gs_edit_name_'+id).value||'').trim();
  if(!name){ alert('El nombre no puede estar vacío.'); return; }
  item.name = name;

  if(cat==='ciclicos'){
    const amount = parseMoney(document.getElementById('gs_edit_amount_'+id).value);
    const period = parseInt(document.getElementById('gs_edit_period_'+id).value, 10);
    if(amount<=0 || !period || period<1){ alert('Revisa el monto total y la periodicidad.'); return; }
    item.totalAmount = amount;
    item.periodMonths = period;
    item.nextDueDate = document.getElementById('gs_edit_date_'+id).value || null;
  } else {
    const amount = parseMoney(document.getElementById('gs_edit_amount_'+id).value);
    if(amount<=0){ alert('El monto debe ser mayor a cero.'); return; }
    item.amount = amount;
    const dateEl = document.getElementById('gs_edit_date_'+id);
    if(dateEl) item.date = dateEl.value || null;
    if(cat==='fijos'){
      const dueDayEl = document.getElementById('gs_edit_dueday_'+id);
      const dueDay = dueDayEl ? parseInt(dueDayEl.value,10) : NaN;
      item.dueDay = (dueDay>=1 && dueDay<=31) ? dueDay : null;
    }
  }

  gastosEditingId = null;
  await saveGastos(cat);
  render();
}

async function onGastosDelete(key){
  const [cat, id] = key.split(':');
  const list = gastosListFor(cat);
  const idx = list.findIndex(x=>x.id===id);
  if(idx>=0) list.splice(idx,1);
  gastosPendingDeleteId = null;
  await saveGastos(cat);
  render();
}

async function onGastosToggleStatus(key){
  const [cat, id] = key.split(':');
  const item = gastosListFor(cat).find(x=>x.id===id);
  if(!item) return;
  item.status = item.status==='Pendiente' ? 'Pagado' : 'Pendiente';
  await saveGastos(cat);
  render();
}

async function onGastosContribute(id){
  const c = gastosCiclicos.find(x=>x.id===id);
  if(!c) return;
  if(!c.contributions) c.contributions = {};
  if(c.contributions[gastosViewMonth] !== undefined) return;
  const provision = Number(c.totalAmount||0)/Math.max(1,Number(c.periodMonths||1));
  c.contributions[gastosViewMonth] = provision;
  await saveGastos('ciclicos');
  render();
}

async function onGastosMarkPaid(id){
  const c = gastosCiclicos.find(x=>x.id===id);
  if(!c) return;
  c.contributions = {};
  c.accumulated = 0;
  if(c.nextDueDate){
    c.nextDueDate = addMonthsToDate(c.nextDueDate, c.periodMonths);
  }
  await saveGastos('ciclicos');
  render();
}

function escapeHtml(s){
  return (s||'').replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function escapeAttr(s){ return escapeHtml(s); }

async function init(){
  document.getElementById('content').innerHTML = '<div class="panel">Cargando...</div>';
  gastosViewMonth = currentMonthStr();
  await loadData();
  const changed = reprogramOverdue();
  if(changed) await saveTasks();
  render();

  document.addEventListener('focusin', (e)=>{
    const tag = e.target.tagName;
    if(tag==='INPUT' || tag==='TEXTAREA' || tag==='SELECT'){
      setTimeout(()=>{
        e.target.scrollIntoView({block:'center', behavior:'smooth'});
      }, 300);
    }
  });
}
init();
</script>
