<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Gestor de tareas de Nico Llano</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.0/chart.umd.min.js"></script>
<style>
  :root{
    --bg:#f7f7f5;
    --panel:#ffffff;
    --border:#e2e0db;
    --text:#26241f;
    --muted:#726f66;
    --accent:#25D366;
    --accent-dark:#128C7E;
    --accent-soft:#e3f9ec;
    --danger:#a4432f;
    --radius:8px;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;
    background:var(--bg);
    color:var(--text);
    font-size:14px;
    line-height:1.4;
  }
  .app{max-width:1100px;margin:0 auto;padding:12px;}
  h1{font-size:17px;margin:0 0 10px 0;}
  h2{font-size:15px;margin:0 0 10px 0;color:var(--text);}

  nav{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-bottom:14px;}
  nav button{
    padding:9px 6px;border:1px solid var(--border);background:var(--panel);
    border-radius:var(--radius);cursor:pointer;font-size:12px;color:var(--text);
    min-height:44px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;position:relative;
  }
  nav button.active{background:var(--accent);color:#fff;border-color:var(--accent);}
  @media (max-width:480px){
    nav button{font-size:10.5px;padding:8px 4px;}
  }

  .notif-badge{
    position:absolute;top:-6px;right:-6px;background:#ff3b30;color:#fff;
    border-radius:999px;min-width:18px;height:18px;padding:0 4px;
    font-size:10.5px;font-weight:700;display:flex;align-items:center;justify-content:center;
    line-height:1;box-shadow:0 0 0 2px var(--bg);
  }

  .panel{background:var(--panel);border:1px solid var(--border);border-radius:var(--radius);padding:14px;margin-bottom:14px;}

  label{display:block;font-size:12px;color:var(--muted);margin-bottom:3px;margin-top:8px;}
  input[type=text],input[type=date],select,textarea{
    width:100%;padding:9px 8px;border:1px solid var(--border);border-radius:6px;
    font-size:14px;background:#fff;color:var(--text);font-family:inherit;min-height:38px;
  }
  textarea{resize:vertical;}
  .row{display:flex;gap:10px;flex-wrap:wrap;}
  .row > div{flex:1;min-width:140px;}
  .field-with-btn{display:flex;gap:6px;align-items:flex-end;}
  .field-with-btn > div{flex:1;}

  button.primary,button.secondary,button.danger{
    min-height:40px;padding:0 14px;border-radius:6px;cursor:pointer;
    font-size:13px;font-weight:600;line-height:1;box-sizing:border-box;
  }
  button.primary{background:var(--accent);color:#fff;border:none;}
  button.secondary{background:#fff;color:var(--text);border:1px solid var(--border);}
  button.danger{background:#fff;color:var(--danger);border:1px solid var(--danger);}
  .task-actions{display:flex;gap:10px;margin-top:8px;flex-wrap:wrap;}
  .task-actions button{flex:1 1 auto;min-width:110px;}
  @media (max-width:480px){
    .task-actions button{min-width:0;flex:1 1 45%;}
  }

  .icon-actions{display:flex;gap:6px;flex-wrap:wrap;flex-shrink:0;}
  .icon-btn{
    width:34px;height:34px;padding:0;border:1px solid var(--border);background:var(--panel);
    border-radius:var(--radius);cursor:pointer;font-size:12.5px;color:var(--text);
    display:inline-flex;align-items:center;justify-content:center;
    box-sizing:border-box;flex-shrink:0;
  }
  .icon-btn:active{transform:scale(0.96);}
  @media (max-width:480px){
    .icon-btn{font-size:11.5px;width:32px;height:32px;}
  }

  .task-card{
    border:1px solid var(--border);border-radius:6px;padding:10px;margin-bottom:8px;background:#fdfdfc;
  }
  .task-top{display:flex;justify-content:space-between;align-items:flex-start;gap:8px;}
  .task-name{font-weight:600;font-size:13.5px;}
  .task-meta{font-size:11.5px;color:var(--muted);margin-top:2px;}
  .task-notes{font-size:11.5px;color:var(--text);margin-top:6px;background:#f7f7f5;border-radius:4px;padding:6px 8px;}
  .badge{display:inline-block;padding:1px 6px;border-radius:10px;font-size:10.5px;margin-right:4px;background:var(--accent-soft);color:var(--accent-dark);}
  .badge.status-organizar{background:#fce8e6;color:#c5221f;}
  .badge.status-sin-iniciar{background:#e8f0fe;color:#1967d2;}
  .badge.status-ejecucion{background:#fef7e0;color:#a35b00;}
  .badge.status-pendiente{background:#f3e8fd;color:#7c3aed;}
  .badge.status-terminada{background:var(--accent-soft);color:var(--accent-dark);}
  .task-card.status-organizar{border-left:3px solid #c5221f;}
  .task-card.status-sin-iniciar{border-left:3px solid #4285F4;}
  .task-card.status-ejecucion{border-left:3px solid #FBBC05;}
  .task-card.status-pendiente{border-left:3px solid #7c3aed;}

  .empty{color:var(--muted);font-size:12.5px;padding:10px 0;}

  .area-block{margin-bottom:22px;}
  .hoy-grid{display:grid;grid-template-columns:1fr;gap:16px;}
  @media (min-width:700px){ .hoy-grid{grid-template-columns:repeat(2,1fr);} }
  @media (min-width:1000px){ .hoy-grid{grid-template-columns:repeat(4,1fr);} }
  .hoy-grid .area-block{margin-bottom:0;min-width:0;}
  .area-title{font-size:15px;font-weight:700;margin-bottom:8px;padding-bottom:4px;border-bottom:2px solid var(--accent);}
  .section-title{font-size:12px;font-weight:700;margin:14px 0 6px 0;color:#fff;background:var(--accent);display:inline-block;padding:2px 8px;border-radius:4px;}
  .cat-title{font-size:11.5px;color:var(--muted);margin:8px 0 4px 0;}

  .edit-grid{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:8px;}
  .edit-grid label{margin-top:0;}
  .edit-grid .full{grid-column:1/-1;}

  .status-msg{font-size:12px;color:var(--muted);margin-bottom:8px;}
  select.mini{padding:4px 6px;font-size:12px;}

  .quick-add-row{display:flex;gap:8px;align-items:flex-end;}
  .quick-add-row textarea{flex:1;min-height:44px;max-height:160px;resize:vertical;}
  .send-btn{
    flex:0 0 auto;width:44px;height:44px;border-radius:50%;border:none;
    background:var(--accent);color:#fff;font-size:18px;cursor:pointer;
    display:flex;align-items:center;justify-content:center;line-height:1;
  }
  .send-btn:active{opacity:.85;}

  .combobox{position:relative;}
  .combobox input{padding-right:30px;background:#fff;}
  .combobox::after{
    content:"▾";position:absolute;right:10px;top:50%;transform:translateY(-50%);
    color:var(--muted);pointer-events:none;font-size:12px;
  }

  .progress-track{background:#ece9e3;border-radius:6px;height:10px;overflow:hidden;margin-top:6px;}
  .progress-fill{background:var(--accent);height:100%;border-radius:6px;}
  .money-row{display:flex;justify-content:space-between;align-items:center;}
  .money-row.total{font-weight:700;font-size:15px;border-top:1px solid var(--border);margin-top:6px;padding-top:8px;}
  .money-negative{color:var(--danger);}
  .modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,0.5);display:flex;align-items:flex-end;justify-content:center;z-index:1000;padding:0;}
  .modal-card{background:#fff;border-radius:14px 14px 0 0;max-height:88vh;overflow-y:auto;width:100%;max-width:640px;padding:16px;}
  @media (min-width:700px){
    .modal-overlay{align-items:center;padding:16px;}
    .modal-card{border-radius:14px;max-height:80vh;}
  }
  .amort-table{width:100%;border-collapse:collapse;font-size:11px;}
  .amort-table th{text-align:right;padding:5px 6px;border-bottom:2px solid var(--border);color:var(--muted);font-weight:600;white-space:nowrap;}
  .amort-table th:first-child{text-align:left;}
  .amort-table td{text-align:right;padding:5px 6px;border-bottom:1px solid var(--border);white-space:nowrap;}
  .amort-table td:first-child{text-align:left;font-weight:600;}
  .compact-table td:first-child, .compact-table th:first-child{max-width:88px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .money-positive{color:var(--accent-dark);}
</style>
</head>
<body>
<div class="app">
  <h1>Gestor de tareas de Nico Llano</h1>
  <nav id="tabs"></nav>
  <nav id="tabs-secondary" class="nav-secondary"></nav>
  <div id="content"></div>
  <div id="modal-root"></div>
</div>

<script>
const AREAS = ['Personales','UTadeo','CDTIC','CNA'];
const AREA_LABEL = {Personales:'Personales', UTadeo:'UTadeo', CDTIC:'Alcaldía (CDTIC)', CNA:'CNA'};
const PRIORITIES = ['Alta','Media','Baja'];
const EFFORTS = ['Alto','Medio','Bajo'];
const ENERGIES = ['Alta','Baja'];
const STATUSES = ['Por organizar','Sin iniciar','En ejecución','Pendiente','Terminada'];

const CATEGORY_MAP = {
  'Alta|Bajo|Alta':   {section:'HOY - HACERLAS YA', order:1},
  'Alta|Bajo|Baja':   {section:'HOY - HACERLAS YA', order:2},
  'Alta|Alto|Alta':   {section:'HOY - DURANTE EL DÍA', order:3},
  'Alta|Alto|Baja':   {section:'PROGRAMAR', order:4},
  'Alta|Medio|Alta':  {section:'PROGRAMAR', order:5},
  'Alta|Medio|Baja':  {section:'PROGRAMAR', order:6},
  'Media|Medio|Alta': {section:'PROGRAMAR', order:7},
  'Media|Medio|Baja': {section:'PROGRAMAR', order:8},
  'Media|Alto|Alta':  {section:'PROGRAMAR', order:9},
  'Media|Alto|Baja':  {section:'PROGRAMAR', order:10},
  'Media|Bajo|Alta':  {section:'PROGRAMAR', order:11},
  'Baja|Bajo|Alta':   {section:'PROGRAMAR', order:12},
  'Baja|Alto|Alta':   {section:'EN ESPERA', order:13},
  'Baja|Alto|Baja':   {section:'EN ESPERA', order:14},
  'Baja|Medio|Alta':  {section:'EN ESPERA', order:15},
  'Baja|Medio|Baja':  {section:'EN ESPERA', order:16},
  'Media|Bajo|Baja':  {section:'EN CAMINO', order:17},
  'Baja|Bajo|Baja':   {section:'EN CAMINO', order:18},
};
const SECTION_ORDER = ['HOY - HACERLAS YA','HOY - DURANTE EL DÍA','PROGRAMAR','EN ESPERA','EN CAMINO'];

function getCategory(p,e,en){
  if(!p||!e||!en) return null;
  return CATEGORY_MAP[p+'|'+e+'|'+en] || null;
}
function todayStr(){
  const d = new Date();
  return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
}
function tomorrowStr(){
  const d = new Date();
  d.setDate(d.getDate()+1);
  return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
}
function uid(){ return 't_'+Date.now()+'_'+Math.random().toString(36).slice(2,8); }
function setToday(inputId){
  const el = document.getElementById(inputId);
  if(el) el.value = todayStr();
}
window.setToday = setToday;

const SECTION_DEFAULTS = {
  'HOY - HACERLAS YA': {priority:'Alta', effort:'Bajo', energy:'Alta'},
  'HOY - DURANTE EL DÍA': {priority:'Alta', effort:'Alto', energy:'Alta'},
  'PROGRAMAR': {priority:'Alta', effort:'Alto', energy:'Baja'},
  'EN ESPERA': {priority:'Baja', effort:'Alto', energy:'Alta'},
  'EN CAMINO': {priority:'Media', effort:'Bajo', energy:'Baja'},
};
function applySectionDefault(section){
  const d = SECTION_DEFAULTS[section];
  if(!d) return;
  const pEl = document.getElementById('d_priority');
  const eEl = document.getElementById('d_effort');
  const nEl = document.getElementById('d_energy');
  if(pEl) pEl.value = d.priority;
  if(eEl) eEl.value = d.effort;
  if(nEl) nEl.value = d.energy;
}
window.applySectionDefault = applySectionDefault;
function blankTask(){
  return {id:null, name:'', area:null, date:null, priority:null, effort:null, energy:null, project:null, notes:'', status:'Por organizar', completedDate:null, createdAt:null};
}

const ICONS = {
  edit: '✏️',
  check: '✅',
  trash: '🗑️',
  save: '💾',
  x: '↩️',
  list: '📋',
  postpone: '⏭️',
  view: '👁️',
};
function iconAction(cls, icon, label, dataAttr){
  return `<button type="button" class="icon-btn" ${dataAttr} title="${label}" aria-label="${label}">${ICONS[icon]}</button>`;
}

let tasks = [];
let projects = [];
let currentTab = 'crear';
let homeSection = null;
let editingTaskId = null;
let pendingDeleteId = null;
let matrixAreaFilter = null;
let expandedProjectId = null;
let editingProjectId = null;
let pendingProjectDeleteId = null;
let expandedSection = null;
let viewingTaskId = null;

// ---------- Estado del módulo Gastos ----------
let gastosIngresos = [];
let gastosFijos = [];
let gastosCiclicos = [];
let gastosExtraordinarios = [];
let gastosEspera = [];
let gastosPrestamos = [];
let gastosAmortModalId = null;
let gastosAmortModalCat = 'espera';
let gastosMetas = [];
let chartInstances = {};
let gastosImportPendingData = null;
let gastosImportConfirmPending = false;
let gastosVistaLista = {};
let gastosSubTab = 'resumen';
let gastosViewMonth = null;
let gastosEditingId = null;
let gastosPendingDeleteId = null;
let gastosSaldoInicial = {};
let gastosMesesCerrados = {};

function monthStr(d){ return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0'); }
function currentMonthStr(){ return monthStr(new Date()); }
function addMonths(ym, delta){
  const [y,m] = ym.split('-').map(Number);
  const d = new Date(y, (m-1)+delta, 1);
  return monthStr(d);
}
function monthLabel(ym){
  const [y,m] = ym.split('-').map(Number);
  const names = ['Enero','Febrero','Marzo','Abril','Mayo','Junio','Julio','Agosto','Septiembre','Octubre','Noviembre','Diciembre'];
  return names[m-1]+' '+y;
}
function formatCOP(n){
  n = Math.round(Number(n)||0);
  return '$'+n.toLocaleString('es-CO');
}
function addMonthsToDate(dateStr, months){
  if(!dateStr) return null;
  const [y,m,d] = dateStr.split('-').map(Number);
  const nd = new Date(y, (m-1)+months, d);
  return monthStr(nd)+'-'+String(nd.getDate()).padStart(2,'0');
}
let pendingImportText = '';
let importConfirmPending = false;
let importWarnings = [];

async function loadData(){
  try{
    const t = await window.storage.get('tasks');
    tasks = t ? JSON.parse(t.value) : [];
  }catch(e){ tasks = []; }
  try{
    const p = await window.storage.get('projects');
    projects = p ? JSON.parse(p.value) : [];
  }catch(e){ projects = []; }
  try{
    const g = await window.storage.get('gastos_ingresos');
    gastosIngresos = g ? JSON.parse(g.value) : [];
  }catch(e){ gastosIngresos = []; }
  try{
    const g = await window.storage.get('gastos_fijos');
    gastosFijos = g ? JSON.parse(g.value) : [];
  }catch(e){ gastosFijos = []; }
  try{
    const g = await window.storage.get('gastos_ciclicos');
    gastosCiclicos = g ? JSON.parse(g.value) : [];
  }catch(e){ gastosCiclicos = []; }
  try{
    const g = await window.storage.get('gastos_extraordinarios');
    gastosExtraordinarios = g ? JSON.parse(g.value) : [];
  }catch(e){ gastosExtraordinarios = []; }
  try{
    const g = await window.storage.get('gastos_espera');
    gastosEspera = g ? JSON.parse(g.value) : [];
  }catch(e){ gastosEspera = []; }
  try{
    const g = await window.storage.get('gastos_prestamos');
    gastosPrestamos = g ? JSON.parse(g.value) : [];
  }catch(e){ gastosPrestamos = []; }
  try{
    const g = await window.storage.get('gastos_metas');
    gastosMetas = g ? JSON.parse(g.value) : [];
  }catch(e){ gastosMetas = []; }
  try{
    const g = await window.storage.get('gastos_saldo');
    const parsed = g ? JSON.parse(g.value) : null;
    gastosSaldoInicial = parsed ? (parsed.inicial||{}) : {};
    gastosMesesCerrados = parsed ? (parsed.cerrados||{}) : {};
  }catch(e){ gastosSaldoInicial = {}; gastosMesesCerrados = {}; }
}
async function saveTasks(){
  try{ await window.storage.set('tasks', JSON.stringify(tasks)); }
  catch(e){ console.error('Error guardando tareas', e); alert('No se pudo guardar. Intenta de nuevo.'); }
}
async function saveProjects(){
  try{ await window.storage.set('projects', JSON.stringify(projects)); }
  catch(e){ console.error('Error guardando proyectos', e); }
}
async function saveGastosSaldo(){
  try{ await window.storage.set('gastos_saldo', JSON.stringify({ inicial: gastosSaldoInicial, cerrados: gastosMesesCerrados })); }
  catch(e){ console.error('Error guardando saldo', e); alert('No se pudo guardar. Intenta de nuevo.'); }
}
async function saveGastos(cat){
  const map = {
    ingresos: gastosIngresos,
    fijos: gastosFijos,
    ciclicos: gastosCiclicos,
    extraordinarios: gastosExtraordinarios,
    espera: gastosEspera,
    prestamos: gastosPrestamos,
    metas: gastosMetas,
  };
  try{ await window.storage.set('gastos_'+cat, JSON.stringify(map[cat])); }
  catch(e){ console.error('Error guardando gastos_'+cat, e); alert('No se pudo guardar. Intenta de nuevo.'); }
}

function reprogramOverdue(){
  const today = todayStr();
  let changed = false;
  tasks.forEach(t=>{
    if((t.status==='Sin iniciar' || t.status==='En ejecución' || t.status==='Pendiente') && t.date && t.date < today){
      t.date = today;
      changed = true;
    }
  });
  return changed;
}

function getOrCreateProject(name, area){
  name = name.trim();
  if(!name) return null;
  let existing = projects.find(p=>p.name.toLowerCase()===name.toLowerCase());
  if(existing) return existing;
  const p = {id:uid(), name, area:area||null};
  projects.push(p);
  return p;
}
function projectsByArea(area){
  return projects.filter(p=>p.area===area).sort((a,b)=>a.name.localeCompare(b.name,'es',{sensitivity:'base'}));
}

// ---------- Tabs ----------
function renderTabs(){
  const nav = document.getElementById('tabs');
  const navSec = document.getElementById('tabs-secondary');
  if(homeSection===null){
    nav.innerHTML = '';
    navSec.innerHTML = '';
    return;
  }

  let primary, secondary;
  if(homeSection==='tareas'){
    primary = [
      ['crear','➕ Crear tarea'],
      ['organizar','📥 Organizar tareas'],
      ['hoy','📅 HOY'],
      ['proyectos','📁 Proyectos'],
    ];
    secondary = [
      ['matriz-area','🗂️ Tareas por tema'],
      ['matriz-general','📋 Todas las tareas'],
      ['completadas','✅ ¡Lo hice!'],
      ['datos','📊 Datos'],
    ];
  } else {
    primary = [
      ['g-resumen','📊 Resumen'],
      ['g-dia','📅 Pagos por hacer'],
      ['g-ingresos','💵 Ingresos'],
      ['g-fijos','📌 Pagos Fijos'],
    ];
    secondary = [
      ['g-ciclicos','🐷 Ahorros'],
      ['g-imprevistos','⚡ Imprevistos'],
      ['g-espera','⏳ Lo que debo'],
      ['g-prestamos','🤝 Lo que me deben'],
      ['g-metas','🎯 Metas'],
      ['g-historial','📜 Historial'],
      ['g-datos','⚙️ Datos'],
    ];
  }
  const pendCount = tasks.filter(t=>t.status==='Por organizar').length;

  nav.innerHTML = '';
  navSec.innerHTML = '';

  const homeBtn = document.createElement('button');
  homeBtn.textContent = '🏠 Inicio';
  homeBtn.title = 'Inicio';
  homeBtn.setAttribute('aria-label','Inicio');
  homeBtn.onclick = ()=>{ homeSection=null; render(); };
  nav.appendChild(homeBtn);

  const allTabs = primary.concat(secondary);
  allTabs.forEach(([key,label])=>{
    const b = document.createElement('button');
    b.textContent = label;
    if(key===currentTab) b.className='active';
    b.onclick = ()=>{ currentTab=key; editingTaskId=null; pendingDeleteId=null; gastosEditingId=null; gastosPendingDeleteId=null; render(); };
    if(key==='organizar' && pendCount>0){
      const badge = document.createElement('span');
      badge.className = 'notif-badge';
      badge.textContent = pendCount>99 ? '99+' : String(pendCount);
      b.appendChild(badge);
    }
    nav.appendChild(b);
  });
}

function viewHome(){
  return `
  <div class="panel" style="text-align:center;padding:36px 16px;">
    <h2 style="margin-bottom:20px;">¿Qué quieres hacer?</h2>
    <button type="button" class="primary" data-home-select="tareas" style="width:100%;padding:18px;font-size:16px;margin-bottom:12px;">🗂️ Tareas</button>
    <button type="button" class="primary" data-home-select="gastos" style="width:100%;padding:18px;font-size:16px;">💰 Gastos</button>
  </div>`;
}

function render(){
  renderTabs();
  const c = document.getElementById('content');
  if(homeSection===null){ c.innerHTML = viewHome(); bindEvents(); updateModal(); return; }
  if(homeSection==='tareas'){
    if(currentTab==='crear') c.innerHTML = viewCrear();
    else if(currentTab==='organizar') c.innerHTML = viewOrganizar();
    else if(currentTab==='hoy') c.innerHTML = viewHoy();
    else if(currentTab==='matriz-area') c.innerHTML = viewMatrizArea();
    else if(currentTab==='matriz-general') c.innerHTML = viewMatrizGeneral();

    else if(currentTab==='g-fijos') c.innerHTML = viewGastosSimpleList('fijos', gastosFijos, 'Pagos Fijos');
    else if(currentTab==='g-ciclicos') c.innerHTML = viewGastosCiclicos();
    else if(currentTab==='g-imprevistos') c.innerHTML = viewGastosDatedList('extraordinarios', gastosExtraordinarios, 'Imprevistos', true);
    else if(currentTab==='g-espera') c.innerHTML = viewGastosEspera();
    else if(currentTab==='g-prestamos') c.innerHTML = viewGastosPrestamos();
    else if(currentTab==='g-metas') c.innerHTML = viewGastosMetas();
    else if(currentTab==='g-historial') c.innerHTML = viewGastosHistorial();
    else if(currentTab==='g-datos') c.innerHTML = viewGastosDatos();
  }
  bindEvents();
  updateModal();
  if(homeSection==='gastos' && currentTab==='g-resumen') renderGastosCharts();
}

function updateModal(){
  const root = document.getElementById('modal-root');
  if(root) root.innerHTML = renderAmortModal();
  bindModalEvents();
}

function renderAmortModal(){
  if(!gastosAmortModalId) return '';
  const item = gastosListFor(gastosAmortModalCat).find(x=>x.id===gastosAmortModalId);

  let bodyHtml;
  if(amort.sinFecha){
    bodyHtml = `<div class="empty">Agrega la fecha en que te prestaron para ver la tabla mes a mes.</div>`;
  } else if(amort.rows.length===0){
    bodyHtml = `<div class="empty">Sin datos suficientes.</div>`;
  } else {
    bodyHtml = `<div style="overflow-x:auto;">
      <table class="amort-table">
        <thead><tr>
          <th>Mes</th><th>Interés</th><th>Abono</th><th>A interés</th><th>A capital</th><th>Saldo capital</th><th>Saldo interés</th><th>Saldo total</th>
        </tr></thead>
        <tbody>
          ${amort.rows.map(row=>`<tr>
            <td>${monthLabel(row.mes)}</td>
            <td>${formatCOP(row.interesMes)}</td>
            <td>${formatCOP(row.abono)}</td>
            <td>${formatCOP(row.aInteres)}</td>
            <td>${formatCOP(row.aCapital)}</td>
            <td>${formatCOP(row.saldoCapital)}</td>
            <td>${formatCOP(row.saldoInteres)}</td>
            <td><strong>${formatCOP(row.saldoTotalMes)}</strong></td>
          </tr>`).join('')}
          ${amort.cierre ? `<tr style="background:var(--accent-soft);">
            <td><strong>${monthLabel(amort.cierre.mes)} (si pagas todo)</strong></td>
            <td>—</td>
            <td>${formatCOP(amort.cierre.montoNecesario)}</td>
            <td>${formatCOP(amort.cierre.interesQueSalda)}</td>
            <td>${formatCOP(amort.cierre.capitalQueSalda)}</td>
            <td>$0</td>
            <td>$0</td>
            <td><strong>$0 — deuda saldada</strong></td>
          </tr>` : ''}
        </tbody>
      </table>
    </div>`;
  }
  return `<div class="modal-overlay" data-modal-close-overlay="1">
    <div class="modal-card" onclick="event.stopPropagation()">
      <div class="task-top" style="margin-bottom:10px;">
        <h2 style="margin:0;">${escapeHtml(item.name)}</h2>
        <button type="button" class="icon-btn" data-modal-close="1" title="Cerrar" aria-label="Cerrar">✕</button>
      </div>
      <div class="money-row"><span>Capital pendiente</span><span>${formatCOP(amort.saldoCapital)}</span></div>
      <div class="money-row"><span>Interés pendiente</span><span>${formatCOP(amort.saldoInteres)}</span></div>
      <div class="money-row total"><span>Total a pagar hoy</span><span>${formatCOP(amort.saldoTotal)}</span></div>
      ${!amort.sinFecha && amort.rows.length ? `<button type="button" class="secondary" data-descargar-amort="${item.id}" style="width:100%;margin-top:10px;">📄 Descargar PDF</button>` : ''}
      ${amort.cierre ? `<div class="status-msg" style="margin-top:8px;">La fila resaltada muestra qué pasaría si pagaras ${formatCOP(amort.cierre.montoNecesario)} para saldar la deuda por completo (capital + interés).</div>` : ''}
      <div style="margin-top:12px;">${bodyHtml}</div>
    </div>
  </div>`;
}

function bindModalEvents(){
  document.querySelectorAll('[data-modal-close]').forEach(b=>{
    b.onclick = ()=>{ gastosAmortModalId = null; updateModal(); };
  });
  document.querySelectorAll('[data-modal-close-overlay]').forEach(b=>{
    b.onclick = ()=>{ gastosAmortModalId = null; updateModal(); };
  });
  document.querySelectorAll('[data-ver-tabla]').forEach(b=>{
    b.onclick = ()=>{
      gastosAmortModalId = b.getAttribute('data-ver-tabla');
      gastosAmortModalCat = b.getAttribute('data-ver-tabla-cat') || 'espera';
      updateModal();
    };
  });
  document.querySelectorAll('[data-descargar-amort]').forEach(b=>{
    b.onclick = ()=>onDescargarAmortizacionPDF(b.getAttribute('data-descargar-amort'), b.getAttribute('data-descargar-amort-cat') || 'espera');
  });
}

function onDescargarAmortizacionPDF(id, cat){
  const item = gastosListFor(cat||'espera').find(x=>x.id===id);
  if(!item) return;
  if(typeof window.jspdf === 'undefined'){
    alert('No se pudo cargar la librería de PDF. Verifica tu conexión a internet e intenta de nuevo.');
    return;
  }
  const amort = calcularAmortizacion(item);
  const { jsPDF } = window.jspdf;
  const doc = new jsPDF();

  doc.setFontSize(16);
  doc.text('Tabla de amortización', 14, 18);
  doc.setFontSize(10);
  doc.setTextColor(120);
  doc.text(`${item.name}  ·  Capital inicial: ${formatCOP(item.amount)}  ·  Tasa: ${item.tasaMensual||0}% mensual  ·  Inicio: ${item.date}`, 14, 25);
  doc.setTextColor(0);

  const head = [['Mes','Interés del mes','Abono','A interés','A capital','Saldo capital','Saldo interés','Saldo total']];
  const body = amort.rows.map(row=>[
    monthLabel(row.mes),
    formatCOP(row.interesMes),
    formatCOP(row.abono),
    formatCOP(row.aInteres),
    formatCOP(row.aCapital),
    formatCOP(row.saldoCapital),
    formatCOP(row.saldoInteres),
    formatCOP(row.saldoTotalMes),
  ]);
  if(amort.cierre){
    body.push([
      monthLabel(amort.cierre.mes)+' (si pagas todo)',
      '—',
      formatCOP(amort.cierre.montoNecesario),
      formatCOP(amort.cierre.interesQueSalda),
      formatCOP(amort.cierre.capitalQueSalda),
      '$0',
      '$0',
      '$0 — saldada',
    ]);
  }

  doc.autoTable({
    head, body, startY: 32,
    styles: { fontSize: 7.5, cellPadding: 2.5 },
    headStyles: { fillColor: [37, 211, 102], textColor: 255 },
    alternateRowStyles: { fillColor: [247, 247, 245] },
    didParseCell: function(data){
      if(amort.cierre && data.row.index === body.length-1){
        data.cell.styles.fillColor = [231, 239, 233];
        data.cell.styles.fontStyle = 'bold';
      }
    },
  });

  const finalY = doc.lastAutoTable.finalY + 10;
  doc.setFontSize(11);
  doc.text(`Capital pendiente: ${formatCOP(amort.saldoCapital)}`, 14, finalY);
  doc.text(`Interés pendiente: ${formatCOP(amort.saldoInteres)}`, 14, finalY+7);
  doc.setFont(undefined, 'bold');
  doc.text(`Total a pagar hoy: ${formatCOP(amort.saldoTotal)}`, 14, finalY+16);

  doc.save('amortizacion_'+item.name.replace(/[^a-z0-9]/gi,'_')+'.pdf');
}

// ---------- Interfaz HOY ----------
function viewHoy(){
  const today = todayStr();
  let html = `<div class="panel"><h2>HOY (${today})</h2><div class="status-msg">Solo tareas programadas para hoy. Orden: 1) En ejecución, 2) Pendientes, 3) Sin iniciar.</div></div>`;
  let anyToday = false;
  let grid = '';
  AREAS.forEach(area=>{
    const areaTasks = tasks.filter(t=>t.area===area && t.date===today && (t.status==='Sin iniciar'||t.status==='En ejecución'||t.status==='Pendiente'));
    if(areaTasks.length===0) return;
    anyToday = true;
    grid += `<div class="area-block"><div class="area-title">${AREA_LABEL[area]}</div>`;

    const uncategorized = areaTasks.filter(t=>!getCategory(t.priority,t.effort,t.energy));
    if(uncategorized.length){
      grid += `<div class="cat-title">Sin categorizar (falta prioridad, esfuerzo o energía)</div>`;
      grid += renderTaskList(sortTasks(uncategorized), false, true, false, true);
    }

    SECTION_ORDER.forEach(section=>{
      const catsInSection = Object.entries(CATEGORY_MAP).filter(([k,v])=>v.section===section).sort((a,b)=>a[1].order-b[1].order);
      let sectionTasksTotal = [];
      catsInSection.forEach(([key])=>{
        const [p,e,en] = key.split('|');
        sectionTasksTotal = sectionTasksTotal.concat(areaTasks.filter(t=>t.priority===p&&t.effort===e&&t.energy===en));
      });
      if(sectionTasksTotal.length===0) return;
      grid += `<div class="section-title">${section}</div>`;
      catsInSection.forEach(([key])=>{
        const [p,e,en] = key.split('|');
        const catTasks = sortTasks(areaTasks.filter(t=>t.priority===p&&t.effort===e&&t.energy===en));
        if(catTasks.length===0) return;
        grid += `<div class="cat-title">${p} prioridad · ${e} esfuerzo · ${en} energía</div>`;
        grid += renderTaskList(catTasks, false, true, false, true);
      });
    });
    grid += `</div>`;
  });
  if(!anyToday) html += `<div class="panel"><div class="empty">No tienes tareas programadas para hoy.</div></div>`;
  else html += `<div class="hoy-grid">${grid}</div>`;
  return html;
}

function viewMatrizArea(){
  let html = `<div class="panel"><h2>Tareas por tema</h2><div class="status-msg">En cada categoría: primero tareas "En ejecución", luego "Sin iniciar" — ordenadas por fecha más próxima primero.</div></div>`;

    html += `<div class="area-block"><div class="area-title">${AREA_LABEL[area]}</div>`;

    const uncategorized = areaTasks.filter(t=>!getCategory(t.priority,t.effort,t.energy));
    if(uncategorized.length){
      html += `<div class="cat-title">Sin categorizar (falta prioridad, esfuerzo o energía)</div>`;
      html += renderTaskList(sortTasks(uncategorized));
    }

    SECTION_ORDER.forEach(section=>{
      const catsInSection = Object.entries(CATEGORY_MAP).filter(([k,v])=>v.section===section).sort((a,b)=>a[1].order-b[1].order);
      let sectionTasksTotal = [];
      catsInSection.forEach(([key])=>{
        const [p,e,en] = key.split('|');
        const catTasks = areaTasks.filter(t=>t.priority===p&&t.effort===e&&t.energy===en);
        sectionTasksTotal = sectionTasksTotal.concat(catTasks);
      });
      if(sectionTasksTotal.length===0 && section!=='EN CAMINO') return;
      html += `<div class="section-title">${section}</div>`;
      if(sectionTasksTotal.length===0){
        html += `<div class="empty">Sin tareas en esta sección.</div>`;

          const [p,e,en] = key.split('|');
          const catTasks = sortTasks(areaTasks.filter(t=>t.priority===p&&t.effort===e&&t.energy===en));
          if(catTasks.length===0) return;
          html += `<div class="cat-title">${p} prioridad · ${e} esfuerzo · ${en} energía</div>`;

        });
      }
    });
    html += `</div>`;
  });

}

// ---------- Interfaz Todas las tareas (matriz general) ----------
function viewMatrizGeneral(){
  let html = `<div class="panel"><h2>Todas las tareas</h2><div class="status-msg">Todas las áreas juntas, en las mismas categorías, ordenadas solo por fecha (más próxima primero).</div></div>`;
  const allTasks = tasks.filter(t=>t.status==='Sin iniciar'||t.status==='En ejecución'||t.status==='Pendiente');

  const uncategorized = allTasks.filter(t=>!getCategory(t.priority,t.effort,t.energy));
  if(uncategorized.length){
    html += `<div class="cat-title">Sin categorizar (falta prioridad, esfuerzo o energía)</div>`;
    html += renderTaskList(sortByDateOnly(uncategorized), true);
  }

  SECTION_ORDER.forEach(section=>{
    const catsInSection = Object.entries(CATEGORY_MAP).filter(([k,v])=>v.section===section).sort((a,b)=>a[1].order-b[1].order);
    let sectionTasksTotal = [];
    catsInSection.forEach(([key])=>{
      const [p,e,en] = key.split('|');
      sectionTasksTotal = sectionTasksTotal.concat(allTasks.filter(t=>t.priority===p&&t.effort===e&&t.energy===en));
    });
    if(sectionTasksTotal.length===0 && section!=='EN CAMINO') return;
    html += `<div class="section-title">${section}</div>`;
    if(sectionTasksTotal.length===0){
      html += `<div class="empty">Sin tareas en esta sección.</div>`;
    } else {
      catsInSection.forEach(([key])=>{
        const [p,e,en] = key.split('|');
        const catTasks = sortByDateOnly(allTasks.filter(t=>t.priority===p&&t.effort===e&&t.energy===en));
        if(catTasks.length===0) return;
        html += `<div class="cat-title">${p} prioridad · ${e} esfuerzo · ${en} energía</div>`;
        html += renderTaskList(catTasks, true);
      });
    }
  });
  return html;
}
function sortByDateOnly(list){
  return list.slice().sort((a,b)=>{
    const da = a.date||'9999-99-99', db = b.date||'9999-99-99';
    return da.localeCompare(db);
  });
}
function sortTasks(list){
  return list.slice().sort((a,b)=>{
    const statusRank = s => s==='En ejecución'?0 : s==='Pendiente'?1 : 2;
    const r = statusRank(a.status)-statusRank(b.status);
    if(r!==0) return r;
    const da = a.date||'9999-99-99', db = b.date||'9999-99-99';
    return da.localeCompare(db);
  });
}
function statusClass(status){
  if(status==='Por organizar') return 'status-organizar';
  if(status==='Sin iniciar') return 'status-sin-iniciar';
  if(status==='En ejecución') return 'status-ejecucion';
  if(status==='Pendiente') return 'status-pendiente';
  if(status==='Terminada') return 'status-terminada';
  return '';
}
function renderTaskList(list, showArea, showPostpone, showNotes, showView){
  return list.map(t=>renderTaskCard(t, showArea, showPostpone, showNotes, showView)).join('');
}
function renderTaskCard(t, showArea, showPostpone, showNotes, showView){
  const editing = editingTaskId===('m_'+t.id);
  if(editing) return renderTaskEditCard(t);
  if(viewingTaskId === t.id) return renderTaskViewCard(t);
  const confirmingDelete = pendingDeleteId === t.id;
  const canComplete = (t.status==='Sin iniciar' || t.status==='En ejecución' || t.status==='Pendiente');
  const actions = confirmingDelete
    ? iconAction('complete','check','Confirmar', `data-confirm-delete="${t.id}"`) + iconAction('cancel','x','Cancelar', `data-cancel-delete="1"`)
    : (showView?iconAction('view','view','Ver', `data-view-task="${t.id}"`):'') + iconAction('edit','edit','Editar', `data-edit-matrix="${t.id}"`) + (canComplete?iconAction('complete','check','Completar', `data-complete-matrix="${t.id}"`):'') + (showPostpone?iconAction('postpone','postpone','Aplazar para mañana', `data-postpone="${t.id}"`):'') + iconAction('delete','trash','Eliminar', `data-delete-matrix="${t.id}"`);
  return `
  <div class="task-card ${statusClass(t.status)}">
    <div class="task-top">
      <div>
        <div class="task-name">${escapeHtml(t.name)}</div>
        <div class="task-meta">
          <span class="badge ${statusClass(t.status)}">${t.status}</span>

function viewProyectos(){
  let html = `<div class="panel"><h2>Proyectos</h2><div class="status-msg">Toca un proyecto para ver y editar sus actividades.</div></div>`;
  AREAS.forEach(area=>{

    else{
      ps.forEach(p=>{
        const tks = tasks.filter(t=>t.project===p.name);

        const isOpen = expandedProjectId===p.id;
        const isEditing = editingProjectId===p.id;

        let headerActions;
        if(isEditing){
          headerActions = iconAction('save','save','Guardar', `data-save-project="${p.id}"`) + iconAction('cancel','x','Cancelar', `data-cancel-edit-project="1"`);
        } else if(isConfirmingDelete){
          headerActions = iconAction('complete','check','Confirmar', `data-confirm-delete-project="${p.id}"`) + iconAction('cancel','x','Cancelar', `data-cancel-delete-project="1"`);
        } else {
          headerActions = iconAction('edit','edit','Renombrar', `data-edit-project="${p.id}"`);
          if(tks.length===0){
            headerActions += iconAction('delete','trash','Eliminar', `data-delete-project="${p.id}"`);
          }
          headerActions += iconAction('list','list', isOpen?'Ocultar':'Actividades', `data-toggle-project="${p.id}"`);
        }

        html += `<div class="task-card">
          <div class="task-top">

                : `<div class="task-name">${escapeHtml(p.name)}</div>`}

function ultimosMeses(n){
  const meses = [];
  let m = gastosViewMonth;
  for(let i=0;i<n;i++){ meses.unshift(m); m = addMonths(m,-1); }
  return meses;
}
function computeMonthSummary(mes){
  const totalIngresos = gastosIngresos.reduce((s,i)=>s+gastosMonthlyInfo('ingresos',i,mes).real,0);
  const totalFijos = gastosFijos.reduce((s,i)=>s+gastosMonthlyInfo('fijos',i,mes).real,0);
  const totalProvisiones = gastosCiclicos.reduce((s,c)=>s+gastosMonthlyInfo('ciclicos',c,mes).real,0);
  const extraordinariosMes = gastosExtraordinarios.filter(e=>e.status==='Pendiente' && e.date && e.date.slice(0,7)===mes);
  const totalExtraordinarios = extraordinariosMes.reduce((s,e)=>s+Number(e.amount||0),0);
  const today = todayStr();
  const esperaVencidos = gastosEspera.filter(e=>e.status==='Pendiente' && e.date && e.date < today);
  const totalEspera = esperaVencidos.reduce((s,e)=>s+deudaSaldoActual('espera', e),0);
  const abonosDeudaDelMes = gastosEspera.reduce((s,e)=>s + (e.abonos||[]).filter(a=>a.date && a.date.slice(0,7)===mes).reduce((s2,a)=>s2+Number(a.amount||0),0), 0);
  const prestamosDelMes = gastosPrestamos.filter(p=>p.date && p.date.slice(0,7)===mes);
  const totalPrestamosSalida = prestamosDelMes.reduce((s,p)=>s+Number(p.amount||0),0);
  const cobrosDelMes = gastosPrestamos.reduce((s,p)=>s + (p.abonos||[]).filter(a=>a.date && a.date.slice(0,7)===mes).reduce((s2,a)=>s2+Number(a.amount||0),0), 0);
  const totalAportesMetas = gastosMetas.reduce((s,m)=>s + (m.aportes||[]).filter(a=>a.date && a.date.slice(0,7)===mes).reduce((s2,a)=>s2+Number(a.amount||0),0), 0);
  const aportesAhorrosDelMes = gastosCiclicos.reduce((s,c)=>s + ((c.contributions && c.contributions[mes]!==undefined) ? Number(c.contributions[mes]) : 0), 0);
  const saldoInicial = Number(gastosSaldoInicial[mes]||0);
  const totalGastos = totalFijos + totalProvisiones + totalExtraordinarios + totalEspera + totalPrestamosSalida + totalAportesMetas;
  const disponible = saldoInicial + totalIngresos + cobrosDelMes - totalGastos;
  return {
    mes, totalIngresos, totalFijos, totalProvisiones, totalExtraordinarios, totalEspera,
    totalPrestamosSalida, cobrosDelMes, totalAportesMetas, aportesAhorrosDelMes, abonosDeudaDelMes,
    saldoInicial, totalGastos, disponible,
    extraordinariosMes, esperaVencidos, prestamosDelMes,
  };
}
function viewGastosResumen(){
  const s = computeMonthSummary(gastosViewMonth);
  const { totalIngresos, totalFijos, totalProvisiones, totalExtraordinarios, totalEspera,

  const mesCerrado = !!gastosMesesCerrados[gastosViewMonth];

  const ingresosPendientes = gastosIngresos.filter(i=>!estaRegistrado(i, gastosViewMonth));
  const fijosPendientes = gastosFijos.filter(i=>!i.isProvision && !estaRegistrado(i, gastosViewMonth));

  html += `

    <div class="money-row"><span>Cobros de préstamos (${monthLabel(gastosViewMonth)})</span><span class="money-positive">+${formatCOP(cobrosDelMes)}</span></div>
    <div class="money-row"><span>Aportes a metas (${monthLabel(gastosViewMonth)})</span><span class="money-negative">-${formatCOP(totalAportesMetas)}</span></div>
    <div class="money-row total"><span>Dinero disponible</span><span class="${disponible>=0?'money-positive':'money-negative'}">${formatCOP(disponible)}</span></div>
  </div>`;

  const pctIngresosDeuda = s.totalIngresos>0 ? Math.round((s.abonosDeudaDelMes/s.totalIngresos)*100) : 0;
  const tasaAhorro = s.totalIngresos>0 ? Math.round((((disponible>0?disponible:0) + s.aportesAhorrosDelMes + s.totalAportesMetas)/s.totalIngresos)*100) : 0;
  html += `<div class="panel">

    <div class="task-meta">${pctIngresosDeuda>40?'🟠 Por encima del 40% suele considerarse zona de riesgo.':'🟢 Dentro de un rango saludable (referencia: menos de 40%).'}</div>
    <div class="money-row" style="margin-top:10px;">
      <span>Tasa de ahorro</span>

    <div class="task-meta">Incluye lo que te sobró, más lo que aportaste a Ahorros y Metas, sobre tus ingresos totales.</div>

  const historico = ultimosMeses(6);
  html += `<div class="panel">

  html += `<div class="panel">
    ${mesCerrado ? `<div class="status-msg">✅ Este mes está cerrado. Su disponible ya pasó como saldo inicial de ${monthLabel(addMonths(gastosViewMonth,1))}.</div>` : `<div class="status-msg">Cuando termines de revisar este mes, ciérralo para pasar el disponible como saldo inicial de ${monthLabel(addMonths(gastosViewMonth,1))}. No pasa nada solo, tienes que cerrarlo tú.</div>`}
    <button type="button" class="${mesCerrado?'secondary':'primary'}" data-gastos-cerrar-mes="1" style="width:100%;">${mesCerrado?'🔒 Volver a cerrar (recalcular)':'🔒 Cerrar '+monthLabel(gastosViewMonth)}</button>

  if(fijosPendientes.length || ciclicosPendientes.length || extraordinariosMes.length || esperaVencidos.length){

    ciclicosPendientes.forEach(c=>{

  if(ingresosPendientes.length || prestamosPendientes.length){

    });

  }
  return html;
}

// ---------- Reconciliación plan vs. real por mes ----------
function gastosProvisionSpent(item, month){
  const txs = (item.transactions && item.transactions[month]) || [];
  return txs.reduce((s,t)=>s+Number(t.amount||0),0);
}
function renderGastosPendingRow(name, amount, action, done){
  return `<div class="task-card ${done?'status-terminada':'status-organizar'}">
    <div class="task-top">
      <div class="task-name">${escapeHtml(name)}</div>
      <div class="task-name">${formatCOP(amount)}</div>
    </div>
  </div>`;
}
function excedenteAcumulado(item){
  const plan = Number(item.amount||0);
  let total = 0;
  const mesesVistos = new Set();
  Object.keys(item.registros||{}).forEach(m=>{
    total += plan - Number((item.registros[m]||{}).monto||0);
    mesesVistos.add(m);
  });
  Object.keys(item.overrides||{}).forEach(m=>{
    if(mesesVistos.has(m)) return;
    total += plan - Number(item.overrides[m]||0);
  });
  return total;
}
function estaRegistrado(item, mes){
  if(item.registros && item.registros[mes]) return true;
  return !!(item.paidMonths && item.paidMonths[mes]);
}
function estaAplazado(item, mes){
  return !!(item.aplazados && item.aplazados[mes]);
}
function fijoArrastre(item, mes){
  return Number((item.arrastre||{})[mes]||0);
}
function fijoMontoDebido(item, mes){
  return Number(item.amount||0) + fijoArrastre(item, mes);
}
function fijoAbonadoParcial(item, mes){
  return ((item.abonosParciales||{})[mes]||[]).reduce((s,a)=>s+Number(a.monto||0),0);
}
function fijoEstadoMes(item, mes){
  const debido = fijoMontoDebido(item, mes);
  if(item.registros && item.registros[mes]){
    return { estado:'pagado', debido, abonado:Number(item.registros[mes].monto), saldo:0, fecha:item.registros[mes].fecha };
  }
  const abonado = fijoAbonadoParcial(item, mes);
  const saldo = debido - abonado;
  if(saldo<=0) return { estado:'pagado', debido, abonado, saldo:0, fecha:null };
  if(estaAplazado(item, mes)) return { estado:'aplazado', debido, abonado, saldo };
  return { estado:'pendiente', debido, abonado, saldo };
}
function gastosMonthlyInfo(cat, item, month){
  if(cat==='ciclicos'){
    const plan = Number(item.totalAmount||0)/Math.max(1,Number(item.periodMonths||1));
    const contrib = (item.contributions && item.contributions[month]!==undefined) ? item.contributions[month] : null;
    return { plan, real: contrib!==null?contrib:plan, confirmed: contrib!==null };
  }
  if(cat==='fijos' && item.isProvision){
    const plan = Number(item.amount||0);
    return { plan, real: gastosProvisionSpent(item, month), confirmed: true };
  }
  const plan = Number(item.amount||0);
  if(item.registros && item.registros[month]){
    const r = item.registros[month];
    return { plan, real: Number(r.monto), confirmed: true, fecha: r.fecha||null };
  }
  const ov = (item.overrides && item.overrides[month]!==undefined) ? item.overrides[month] : null;
  const paidLegacy = !!(item.paidMonths && item.paidMonths[month]);
  return { plan, real: ov!==null?ov:plan, confirmed: paidLegacy, fecha: null };
}
function gastosSetMonthly(cat, item, month, value){
  if(cat==='ciclicos'){
    if(!item.contributions) item.contributions = {};
    item.contributions[month] = value;
  } else {
    if(!item.overrides) item.overrides = {};
    item.overrides[month] = value;
  }
}
function gastosResetMonthly(cat, item, month){
  if(cat==='ciclicos'){
    if(item.contributions) delete item.contributions[month];
  } else {
    if(item.overrides) delete item.overrides[month];
  }
}
function ciclicoAccumulated(c){
  const contrib = c.contributions || {};
  let sum = Object.values(contrib).reduce((s,v)=>s+Number(v||0),0);
  if((!c.contributions || Object.keys(c.contributions).length===0) && c.accumulated){
    sum += Number(c.accumulated||0);
  }
  return sum;
}
function renderGastosReconcileItem(cat, item){
  const key = cat+':'+item.id;
  const info = gastosMonthlyInfo(cat, item, gastosViewMonth);
  const isEditing = gastosEditingId === ('reconcile:'+key);
  if(isEditing){
    return `<div class="task-card">
      <div class="task-name">${escapeHtml(item.name)}</div>

      <input type="text" id="gs_recon_amount_${item.id}" value="${info.real}" inputmode="numeric">

      </div>
    </div>`;
  }
  let actions = iconAction('edit','edit','Ajustar', `data-gastos-reconcile-edit="${key}"`);
  actions += info.confirmed
    ? iconAction('cancel','x','Volver al plan', `data-gastos-reconcile-reset="${key}"`)
    : iconAction('complete','check','Confirmar', `data-gastos-reconcile-confirm="${key}"`);
  const diff = info.real - info.plan;
  let varianceHtml = '';
  if(info.confirmed && diff !== 0){
    const isIncome = cat==='ingresos';
    const good = isIncome ? diff>0 : diff<0;
    varianceHtml = `<div class="task-meta" style="margin-top:2px;"><span class="${good?'money-positive':'money-negative'}">${diff>=0?'+':'-'}${formatCOP(Math.abs(diff))} vs. plan</span></div>`;
  }
  return `<div class="task-card ${info.confirmed?'status-terminada':'status-sin-iniciar'}">
    <div class="task-top">
      <div>
        <div class="task-name">${escapeHtml(item.name)}</div>
        <div class="task-meta">Plan: ${formatCOP(info.plan)} · <span class="badge ${info.confirmed?'status-terminada':'status-sin-iniciar'}">${info.confirmed?'Confirmado':'Usando plan'}</span></div>
        ${varianceHtml}
      </div>
      <div class="task-name">${formatCOP(info.real)}</div>
    </div>
    <div class="icon-actions" style="margin-top:8px;">${actions}</div>
  </div>`;
}

  return html;

function gastosOrdenKey(cat, item){
  if(item.isProvision) return 3;
  if(cat==='fijos'){

    return info.estado==='pagado' ? 2 : (info.estado==='aplazado' ? 1 : 0);
  }
  return estaRegistrado(item, gastosViewMonth) ? 2 : 0;
}

function esperaAbonado(item){
  return (item.abonos||[]).reduce((s,a)=>s+Number(a.amount||0),0);
}
function esperaSaldo(item){
  return Number(item.amount||0) - esperaAbonado(item);
}

// ---------- Motor de amortización (interés simple sobre capital pendiente) ----------
function calcularAmortizacion(item){
  const capitalInicial = Number(item.amount||0);
  const tasa = Number(item.tasaMensual||0) / 100;
  const abonos = item.abonos || [];

  if(!item.date){
    const abonado = esperaAbonado(item);
    const saldoCapital = Math.max(0, capitalInicial - abonado);
    return { rows: [], saldoCapital, saldoInteres: 0, saldoTotal: saldoCapital, sinFecha: true };
  }

  const abonosPorMes = {};
  abonos.forEach(a=>{
    if(!a.date) return;
    const am = a.date.slice(0,7);
    abonosPorMes[am] = (abonosPorMes[am]||0) + Number(a.amount||0);
  });

  const startMonth = item.date.slice(0,7);
  const endMonth = currentMonthStr();
  let capital = capitalInicial;
  let interesAcum = 0;
  const rows = [];
  let m = startMonth;
  let iter = 0;
  while(iter < 600){
    iter++;
    const interesMes = capital * tasa;
    interesAcum += interesMes;
    const abonoMes = abonosPorMes[m] || 0;
    const aInteres = Math.min(abonoMes, interesAcum);
    interesAcum -= aInteres;
    const restante = abonoMes - aInteres;
    const aCapital = Math.min(restante, capital);
    capital -= aCapital;
    rows.push({ mes:m, interesMes, abono:abonoMes, aInteres, aCapital, saldoCapital:capital, saldoInteres:interesAcum, saldoTotalMes: capital+interesAcum });
    if(m === endMonth || (m > endMonth)) break;
    m = addMonths(m, 1);
  }
  const saldoCapitalFinal = capital;
  const saldoInteresFinal = interesAcum;
  const saldoTotalFinal = saldoCapitalFinal + saldoInteresFinal;

  let cierre = null;
  if(saldoTotalFinal > 0){
    cierre = {
      mes: endMonth,
      montoNecesario: saldoTotalFinal,
      capitalQueSalda: saldoCapitalFinal,
      interesQueSalda: saldoInteresFinal,
    };
  }

  return { rows, saldoCapital:saldoCapitalFinal, saldoInteres:saldoInteresFinal, saldoTotal:saldoTotalFinal, sinFecha:false, cierre };
}
function deudaSaldoActual(cat, item){
  if(cat==='espera' || cat==='prestamos') return calcularAmortizacion(item).saldoTotal;
  return esperaSaldo(item);
}

function metaAportado(meta){
  return (meta.aportes||[]).reduce((s,a)=>s+Number(a.amount||0),0);
}
function metaRitmoInfo(meta){
  const objetivo = Number(meta.montoObjetivo||0);
  const aportado = metaAportado(meta);
  if(!meta.fechaLimite || !meta.createdAt){
    return { objetivo, aportado, esperado:null, diferencia:null, pct: objetivo>0?Math.min(100,Math.round(aportado/objetivo*100)):0 };
  }
  const inicio = new Date(meta.createdAt);
  const fin = new Date(meta.fechaLimite+'T00:00:00');
  const hoy = new Date();
  const mesesTotales = Math.max(1, (fin.getFullYear()-inicio.getFullYear())*12 + (fin.getMonth()-inicio.getMonth()));
  let mesesTranscurridos = (hoy.getFullYear()-inicio.getFullYear())*12 + (hoy.getMonth()-inicio.getMonth());
  mesesTranscurridos = Math.max(0, Math.min(mesesTotales, mesesTranscurridos));
  const esperado = objetivo * (mesesTranscurridos/mesesTotales);
  const diferencia = aportado - esperado;
  const pct = objetivo>0 ? Math.min(100, Math.round(aportado/objetivo*100)) : 0;
  return { objetivo, aportado, esperado, diferencia, pct };
}

    <label>Fecha ${cat==='espera'?'(opcional, si la sabes)':''}</label>
    <input type="date" id="gs_new_date_${cat}">
    <button type="button" class="primary" data-gastos-add="${cat}" style="width:100%;margin-top:8px;">➤ Agregar</button>
  </div>`;
  html += `<div class="panel">`;
  const sorted = list.slice().sort((a,b)=>(a.date||'9999').localeCompare(b.date||'9999'));
  if(sorted.length===0){
    html += `<div class="empty">Sin registros.</div>`;
  } else {
    html += renderGastosDatedTabla(cat, sorted);
  }
  html += `</div>`;
  return html;
}
function renderGastosDatedTabla(cat, sorted){
  const rows = sorted.map(item=>{
    const key = cat+':'+item.id;
    const isEditing = gastosEditingId===key;
    if(isEditing){
      return `<tr><td colspan="4" style="padding:8px;background:var(--panel);">
        <div class="task-card" style="margin:0;">
          <label>Nombre</label>
          <input type="text" id="gs_edit_name_${item.id}" value="${escapeAttr(item.name)}">
          <label>Monto</label>
          <input type="text" id="gs_edit_amount_${item.id}" value="${item.amount}" inputmode="numeric">
          <label>Fecha</label>
          <input type="date" id="gs_edit_date_${item.id}" value="${item.date||''}">
          <div class="icon-actions" style="margin-top:8px;">
            ${iconAction('save','save','Guardar', `data-gastos-save="${key}"`)}
            ${iconAction('cancel','x','Cancelar', `data-gastos-cancel-edit="1"`)}
            ${iconAction('delete','trash','Eliminar', `data-gastos-delete="${key}"`)}
          </div>
        </div>
      </td></tr>`;
    }
    const isVencido = item.status==='Pendiente' && item.date && item.date < todayStr();
    const isRegistrando = gastosEditingId === ('registrarimprevisto:'+item.id);
    const infoImp = imprevistoEstado(item);
    if(isRegistrando){
      return `<tr><td colspan="4" style="padding:8px;background:var(--panel);">
        <div class="task-card" style="margin:0;">
          ${infoImp.abonado>0 ? `<div class="task-meta">Ya abonaste ${formatCOP(infoImp.abonado)}. Saldo pendiente: ${formatCOP(infoImp.saldo)}.</div>` : ''}
          <label>Fecha real</label>
          <input type="date" id="gs_reg_imprevisto_fecha_${item.id}" value="${todayStr()}">
          <label>Monto (completo o parcial)</label>
          <input type="text" id="gs_reg_imprevisto_monto_${item.id}" value="${infoImp.saldo>0?infoImp.saldo:item.amount}" inputmode="numeric">
          <div class="icon-actions" style="margin-top:8px;">
            ${iconAction('save','save','Guardar', `data-gastos-registrar-imprevisto-save="${item.id}"`)}
            ${iconAction('cancel','x','Cancelar', `data-gastos-cancel-edit="1"`)}
          </div>
        </div>
      </td></tr>`;
    }

    let estadoHtml;
    if(infoImp.estado==='pagado') estadoHtml = `<span class="money-positive">🟢 ${item.fechaPago||''}</span>`;
    else if(isVencido) estadoHtml = `<span class="money-negative">🔴 Vencido</span>`;
    else estadoHtml = `🔴${infoImp.abonado>0?` (abonado ${formatCOP(infoImp.abonado)})`:''}`;

    let accionBtn;
    if(infoImp.estado==='pagado'){
      accionBtn = (item.abonos && item.abonos.length)
        ? `<button type="button" class="icon-btn" style="width:28px;height:28px;font-size:11px;" data-gastos-deshacer-abono-imprevisto="${item.id}" title="Deshacer último abono">↩️</button>`
        : `<button type="button" class="icon-btn" style="width:28px;height:28px;font-size:11px;" data-gastos-toggle-status="${key}" title="Reabrir">↩️</button>`;
    } else {
      accionBtn = `<button type="button" class="icon-btn" style="width:28px;height:28px;font-size:11px;" data-gastos-registrar-imprevisto-open="${item.id}" title="Registrar pago">📝</button>
        <button type="button" class="icon-btn" style="width:28px;height:28px;font-size:11px;" data-gastos-aplazar-imprevisto="${item.id}" title="Aplazar al mes siguiente">⏭️</button>`;
      if(item.abonos && item.abonos.length) accionBtn += `<button type="button" class="icon-btn" style="width:28px;height:28px;font-size:11px;" data-gastos-deshacer-abono-imprevisto="${item.id}" title="Deshacer último abono">↩️</button>`;
    }

    return `<tr>
      <td style="text-align:left;">${escapeHtml(item.name)}${item.date?`<div style="font-size:10.5px;color:var(--muted);margin-top:2px;">Planeado: ${item.date}</div>`:''}</td>
      <td>${formatCOP(item.amount)}</td>
      <td>${estadoHtml}</td>
      <td>
        ${accionBtn}
        <button type="button" class="icon-btn" style="width:28px;height:28px;font-size:11px;" data-gastos-edit="${key}" title="Editar">✏️</button>
      </td>
    </tr>`;
  }).join('');
  return `<div class="task-meta" style="text-align:center;margin-bottom:4px;">💡 Si no ves todo, gira el celular</div>
  <div style="overflow-x:auto;">
    <table class="amort-table compact-table">
      <thead><tr><th>Nombre</th><th>Monto</th><th>Estado</th><th></th></tr></thead>
      <tbody>${rows}</tbody>
    </table>
  </div>`;
}

function renderGastosCharts(){
  if(typeof window.Chart === 'undefined') return;
  const meses = ultimosMeses(6);
  const resumenes = meses.map(m=>computeMonthSummary(m));
  const labels = meses.map(m=>monthLabel(m).split(' ')[0].slice(0,3)+' '+m.slice(2,4));

  Object.values(chartInstances).forEach(ch=>{ if(ch) ch.destroy(); });
  chartInstances = {};

  const elDisponible = document.getElementById('chart-disponible');
  if(elDisponible){
    chartInstances.disponible = new Chart(elDisponible, {
      type: 'line',
      data: {
        labels,
        datasets: [{
          label: 'Disponible',
          data: resumenes.map(r=>r.disponible),
          borderColor: '#25D366',
          backgroundColor: 'rgba(37,211,102,0.15)',
          fill: true,
          tension: 0.25,
        }]
      },
      options: { plugins:{legend:{display:false}}, scales:{ y:{ ticks:{ callback:v=>formatCOP(v) } } } }
    });
  }

  const elIG = document.getElementById('chart-ingresos-gastos');
  if(elIG){
    chartInstances.ingresosGastos = new Chart(elIG, {
      type: 'bar',
      data: {
        labels,
        datasets: [
          { label:'Ingresos', data: resumenes.map(r=>r.totalIngresos+r.cobrosDelMes), backgroundColor:'#25D366' },
          { label:'Gastos', data: resumenes.map(r=>r.totalGastos), backgroundColor:'#c5221f' },
        ]
      },
      options: { plugins:{legend:{position:'bottom'}}, scales:{ y:{ ticks:{ callback:v=>formatCOP(v) } } } }
    });
  }

  const elDist = document.getElementById('chart-distribucion');
  if(elDist){
    const actual = resumenes[resumenes.length-1];
    const dataVals = [actual.totalFijos, actual.totalProvisiones, actual.totalExtraordinarios, actual.totalEspera, actual.totalAportesMetas];
    const dataLabels = ['Fijos','Ahorros','Imprevistos','Deuda','Metas'];
    const colores = ['#4285F4','#128C7E','#a35b00','#c5221f','#7c3aed'];
    const filtrados = dataLabels.map((l,i)=>({l,v:dataVals[i],c:colores[i]})).filter(x=>x.v>0);
    if(filtrados.length===0){
      elDist.style.display = 'none';
    } else {
      elDist.style.display = '';
      chartInstances.distribucion = new Chart(elDist, {
        type: 'doughnut',
        data: {
          labels: filtrados.map(x=>x.l),
          datasets: [{ data: filtrados.map(x=>x.v), backgroundColor: filtrados.map(x=>x.c) }]
        },
        options: { plugins:{legend:{position:'bottom'}} }
      });
    }
  }
}

function getAllMovimientos(){
  const movimientos = [];

  gastosIngresos.forEach(i=>{
    const mesesVistos = new Set();
    Object.keys(i.registros||{}).forEach(mes=>{
      const r = i.registros[mes];
      movimientos.push({fecha:r.fecha||mes, tipo:'Ingreso', icono:'💵', nombre:i.name, monto:r.monto, signo:1});
      mesesVistos.add(mes);
    });
    Object.keys(i.paidMonths||{}).forEach(mes=>{
      if(i.paidMonths[mes] && !mesesVistos.has(mes)){
        const info = gastosMonthlyInfo('ingresos', i, mes);
        movimientos.push({fecha:mes, tipo:'Ingreso', icono:'💵', nombre:i.name, monto:info.real, signo:1});
      }
    });
  });
  gastosFijos.forEach(i=>{
    if(!i.isProvision){
      const mesesVistos = new Set();
      Object.keys(i.registros||{}).forEach(mes=>{
        const r = i.registros[mes];
        movimientos.push({fecha:r.fecha||mes, tipo:'Fijo', icono:'📌', nombre:i.name, monto:r.monto, signo:-1});
        mesesVistos.add(mes);
      });
      Object.keys(i.paidMonths||{}).forEach(mes=>{
        if(i.paidMonths[mes] && !mesesVistos.has(mes)){
          const info = gastosMonthlyInfo('fijos', i, mes);
          movimientos.push({fecha:mes, tipo:'Fijo', icono:'📌', nombre:i.name, monto:info.real, signo:-1});
        }
      });
    } else {
      Object.keys(i.transactions||{}).forEach(mes=>{
        (i.transactions[mes]||[]).forEach(t=>{
          movimientos.push({fecha:t.date||mes, tipo:'Provisión', icono:'📌', nombre:t.desc||i.name, monto:t.amount, signo:-1});
        });
      });
    }
  });
  gastosCiclicos.forEach(c=>{
    Object.keys(c.contributions||{}).forEach(mes=>{
      movimientos.push({fecha:mes, tipo:'Ahorro', icono:'🐷', nombre:c.name, monto:c.contributions[mes], signo:-1});
    });
  });
  gastosExtraordinarios.forEach(e=>{
    if(e.status==='Pagado'){
      movimientos.push({fecha:e.date||'', tipo:'Imprevisto', icono:'⚡', nombre:e.name, monto:e.amount, signo:-1});
    }
  });
  gastosEspera.forEach(e=>{
    (e.abonos||[]).forEach(a=>{
      movimientos.push({fecha:a.date||'', tipo:'Abono a deuda', icono:'⏳', nombre:e.name, monto:a.amount, signo:-1});
    });
  });
  gastosPrestamos.forEach(p=>{
    (p.abonos||[]).forEach(a=>{
      movimientos.push({fecha:a.date||'', tipo:'Cobro de préstamo', icono:'🤝', nombre:p.name, monto:a.amount, signo:1});
    });
  });
  gastosMetas.forEach(m=>{
    (m.aportes||[]).forEach(a=>{
      movimientos.push({fecha:a.date||'', tipo:'Aporte a meta', icono:'🎯', nombre:m.name, monto:a.amount, signo:-1});
    });
  });

  movimientos.sort((a,b)=>(a.fecha||'').localeCompare(b.fecha||''));
  return movimientos;
}

  });
  html += `</div>`;
  return html;
}

function viewGastosDia(){
  const today = todayStr();
  const todayDay = new Date().getDate();
  const mesActual = currentMonthStr();
  let html = `<div class="panel"><h2>Pagos por hacer</h2><div class="status-msg">Lo que vence hoy, y todo lo demás que sigue pendiente de pagar o cobrar.</div></div>`;

  const ciclicosHoy = gastosCiclicos.filter(c=>c.nextDueDate===today);
  const imprevistosHoy = gastosExtraordinarios.filter(e=>e.status==='Pendiente' && e.date===today);
  const esperaVencidosAtras = gastosEspera.filter(e=>e.status==='Pendiente' && e.date && e.date < today && !e.diaPago);
  const esperaHoy = gastosEspera.filter(e=>e.status==='Pendiente' && e.diaPago===todayDay);

  // ---------- Pagos Fijos: lista propia, ordenada Pendiente -> Aplazado -> Pagado ----------
  const fijosOrdenados = gastosFijos.filter(i=>!i.isProvision).map(i=>{
    const info = fijoEstadoMes(i, mesActual);
    const orden = info.estado==='pagado' ? 2 : (info.estado==='aplazado' ? 1 : 0);
    return { item:i, info, orden };
  }).sort((a,b)=>a.orden-b.orden);

  html += `<div class="panel"><h2>📌 Pagos Fijos</h2>`;
  if(fijosOrdenados.length===0){
    html += `<div class="empty">No tienes pagos fijos registrados.</div>`;
  } else {
    fijosOrdenados.forEach(({item, info})=>{
      const circulo = info.estado==='pagado' ? '🟢' : (info.estado==='aplazado' ? '🟡' : '🔴');
      let estado;
      if(info.estado==='pagado') estado = `Pagado${info.fecha?' el '+info.fecha:''}`;
      else if(info.estado==='aplazado') estado = `Aplazado — quedan ${formatCOP(info.saldo)} para el próximo mes`;
      else estado = (item.dueDay ? `Pendiente (día ${item.dueDay})` : 'Pendiente') + (info.abonado>0?` — abonado ${formatCOP(info.abonado)}`:'');
      html += `<div class="task-card ${info.estado==='pagado'?'status-terminada':''}">
        <div class="task-top">
          <div class="task-name">${circulo} ${escapeHtml(item.name)}</div>
          <div class="task-name">${formatCOP(info.debido)}</div>
        </div>
        <div class="task-meta">${estado}</div>
      </div>`;
    });
  }
  html += `</div>`;

  const anyHoy = ciclicosHoy.length || imprevistosHoy.length || esperaHoy.length;
  html += `<div class="panel"><h2>🔴 Vence hoy</h2>`;
  if(!anyHoy){
    html += `<div class="empty">Nada vence hoy.</div>`;
  } else {
    let totalHoy = 0;
    let filasHoy = '';
    ciclicosHoy.forEach(c=>{
      const provision = Number(c.totalAmount||0)/Math.max(1,Number(c.periodMonths||1));
      totalHoy += provision;
      filasHoy += renderGastosPendingRow('🐷 '+c.name, provision, {type:'ciclico', id:c.id, month:mesActual});
    });
    imprevistosHoy.forEach(e=>{
      totalHoy += Number(e.amount||0);
      filasHoy += renderGastosPendingRow('⚡ '+e.name, e.amount, null);
    });
    esperaHoy.forEach(e=>{
      const saldoE = deudaSaldoActual('espera', e);
      totalHoy += saldoE;
      filasHoy += renderGastosPendingRow('⏳ '+e.name+' (día '+e.diaPago+')', saldoE, {type:'espera', id:e.id});
    });
    html += `<div class="money-row total"><span>Total de hoy</span><span class="money-negative">${formatCOP(totalHoy)}</span></div>${filasHoy}`;
  }
  html += `</div>`;

  const ciclicosPend = gastosCiclicos.filter(c=>!ciclicosHoy.includes(c) && !(c.contributions && c.contributions[mesActual]!==undefined));
  const imprevistosPend = gastosExtraordinarios.filter(e=>e.status==='Pendiente' && !imprevistosHoy.includes(e));
  const esperaPend = gastosEspera.filter(e=>e.status==='Pendiente' && !esperaHoy.includes(e) && deudaSaldoActual('espera', e)>0);

  const anyPend = ciclicosPend.length || imprevistosPend.length || esperaPend.length;
  html += `<div class="panel"><h2>🟡 Otros pendientes</h2>`;
  if(!anyPend){
    html += `<div class="empty">No tienes más pagos pendientes.</div>`;
  } else {
    let totalOtros = 0;
    let filasOtros = '';
    ciclicosPend.forEach(c=>{
      const provision = Number(c.totalAmount||0)/Math.max(1,Number(c.periodMonths||1));
      totalOtros += provision;
      filasOtros += renderGastosPendingRow('🐷 '+c.name+(c.nextDueDate?` (próx. ${c.nextDueDate})`:''), provision, {type:'ciclico', id:c.id, month:mesActual});
    });
    imprevistosPend.forEach(e=>{
      totalOtros += Number(e.amount||0);
      filasOtros += renderGastosPendingRow('⚡ '+e.name+(e.date?` (${e.date})`:''), e.amount, null);
    });
    esperaPend.forEach(e=>{
      const saldoE = deudaSaldoActual('espera', e);
      totalOtros += saldoE;
      filasOtros += renderGastosPendingRow('⏳ '+e.name+(e.diaPago?` (día ${e.diaPago})`:' (sin día de pago fijo — agrégaselo si quieres verlo aquí)'), saldoE, {type:'espera', id:e.id});
    });
    html += `<div class="money-row total"><span>Total otros pendientes</span><span class="money-negative">${formatCOP(totalOtros)}</span></div>${filasOtros}`;
  }
  html += `</div>`;

  // ---------- Por cobrar ----------
  const ingresosHoy = gastosIngresos.filter(i=>i.dueDay===todayDay && !estaRegistrado(i, mesActual));
  const prestamosHoy = gastosPrestamos.filter(p=>p.diaPago===todayDay && deudaSaldoActual('prestamos', p)>0);
  const anyCobrarHoy = ingresosHoy.length || prestamosHoy.length;
  html += `<div class="panel"><h2>💰 Por cobrar hoy</h2>`;
  if(!anyCobrarHoy){
    html += `<div class="empty">Nada que cobrar hoy.</div>`;
  } else {
    let totalCobrarHoy = 0;
    let filasCobrarHoy = '';
    ingresosHoy.forEach(i=>{
      const info = gastosMonthlyInfo('ingresos', i, mesActual);
      totalCobrarHoy += info.plan;
      filasCobrarHoy += renderGastosPendingRow('💵 '+i.name, info.plan, {type:'ingreso', id:i.id, month:mesActual});
    });
    prestamosHoy.forEach(p=>{
      const saldoP = deudaSaldoActual('prestamos', p);
      totalCobrarHoy += saldoP;
      filasCobrarHoy += renderGastosPendingRow('🤝 '+p.name+' (día '+p.diaPago+')', saldoP, {type:'prestamo', id:p.id});
    });
    html += `<div class="money-row total"><span>Total por cobrar hoy</span><span class="money-positive">+${formatCOP(totalCobrarHoy)}</span></div>${filasCobrarHoy}`;
  }
  html += `</div>`;

  const ingresosPendCobro = gastosIngresos.filter(i=>!ingresosHoy.includes(i) && !estaRegistrado(i, mesActual));
  const prestamosPendCobro = gastosPrestamos.filter(p=>!prestamosHoy.includes(p) && deudaSaldoActual('prestamos', p)>0);
  const anyPendCobro = ingresosPendCobro.length || prestamosPendCobro.length;
  html += `<div class="panel"><h2>🟢 Otros por cobrar</h2>`;
  if(!anyPendCobro){
    html += `<div class="empty">No tienes más cobros pendientes.</div>`;
  } else {
    let totalPendCobro = 0;
    let filasPendCobro = '';
    ingresosPendCobro.forEach(i=>{
      const info = gastosMonthlyInfo('ingresos', i, mesActual);
      totalPendCobro += info.plan;
      filasPendCobro += renderGastosPendingRow('💵 '+i.name+(i.dueDay?` (día ${i.dueDay})`:''), info.plan, {type:'ingreso', id:i.id, month:mesActual});
    });
    prestamosPendCobro.forEach(p=>{
      const saldoP = deudaSaldoActual('prestamos', p);
      totalPendCobro += saldoP;
      filasPendCobro += renderGastosPendingRow('🤝 '+p.name+(p.diaPago?` (día ${p.diaPago})`:' (sin día de pago fijo)'), saldoP, {type:'prestamo', id:p.id});
    });
    html += `<div class="money-row total"><span>Total otros por cobrar</span><span class="money-positive">+${formatCOP(totalPendCobro)}</span></div>${filasPendCobro}`;
  }
  html += `</div>`;

  const ciclicosPagados = gastosCiclicos.filter(c=>c.contributions && c.contributions[mesActual]!==undefined);
  const imprevistosPagados = gastosExtraordinarios.filter(e=>e.status==='Pagado' && e.date && e.date.slice(0,7)===mesActual);
  const esperaPagados = gastosEspera.filter(e=>e.status==='Pagado');
  const ingresosRecibidos = gastosIngresos.filter(i=>estaRegistrado(i, mesActual));
  const prestamosCobrados = gastosPrestamos.filter(p=>p.status==='Pagado');

  const anyPagado = ciclicosPagados.length || imprevistosPagados.length || esperaPagados.length || ingresosRecibidos.length || prestamosCobrados.length;
  if(anyPagado){
    html += `<div class="panel"><h2>✅ Ya pagado / cobrado (${monthLabel(mesActual)})</h2>`;
    ingresosRecibidos.forEach(i=>{
      const info = gastosMonthlyInfo('ingresos', i, mesActual);
      html += renderGastosPendingRow('💵 '+i.name, info.real, null, true);
    });
    ciclicosPagados.forEach(c=>{
      const provision = Number(c.totalAmount||0)/Math.max(1,Number(c.periodMonths||1));
      html += renderGastosPendingRow('🐷 '+c.name, provision, null, true);
    });
    imprevistosPagados.forEach(e=>{ html += renderGastosPendingRow('⚡ '+e.name, e.amount, null, true); });
    esperaPagados.forEach(e=>{ html += renderGastosPendingRow('⏳ '+e.name+' (saldado)', e.amount, null, true); });
    prestamosCobrados.forEach(p=>{ html += renderGastosPendingRow('🤝 '+p.name+' (saldado)', p.amount, null, true); });
    html += `</div>`;
  }

  return html;
}

function procesarImportacionGastos(sheets){
  const nuevosIngresos = (sheets['Ingresos']||[]).map(r=>({
    id:uid(), name:String(r['Nombre']||'').trim(), amount:Number(r['Monto planeado'])||0, overrides:{}, paidMonths:{}, registros:{}
  })).filter(i=>i.name);

  const nuevosFijos = (sheets['Pagos Fijos']||[]).map(r=>{
    const isProv = String(r['Es provisión']||'').trim()==='Sí';
    const item = { id:uid(), name:String(r['Nombre']||'').trim(), amount:Number(r['Monto planeado'])||0, overrides:{}, paidMonths:{}, registros:{} };
    if(isProv){ item.isProvision = true; item.transactions = {}; }
    const dueDay = parseInt(r['Día vencimiento'],10);
    if(dueDay>=1 && dueDay<=31) item.dueDay = dueDay;
    return item;
  }).filter(i=>i.name);

  const nuevosCiclicos = (sheets['Ahorros']||[]).map(r=>({
    id:uid(), name:String(r['Nombre']||'').trim(), totalAmount:Number(r['Monto total'])||0,
    periodMonths: Number(r['Cada cuántos meses'])||1, nextDueDate: r['Próxima fecha']||null, contributions:{}
  })).filter(c=>c.name);

  const nuevosImprevistos = (sheets['Imprevistos']||[]).map(r=>({
    id:uid(), name:String(r['Nombre']||'').trim(), amount:Number(r['Monto'])||0, date:r['Fecha']||null,
    status: r['Estado']||'Pendiente'
  })).filter(e=>e.name);

  const nuevosEspera = (sheets['Lo que debo']||[]).map(r=>({
    id:uid(), name:String(r['Nombre']||'').trim(), amount:Number(r['Monto'])||0, date:r['Fecha']||null,
    tasaMensual: Number(r['Tasa mensual %'])||0,
    cuotaPactada: r['Cuota pactada'] ? Number(r['Cuota pactada']) : null,
    status: r['Estado']||'Pendiente', abonos:[]
  })).filter(e=>e.name);

  const nuevosPrestamos = (sheets['Lo que me deben']||[]).map(r=>({
    id:uid(), name:String(r['Nombre']||'').trim(), amount:Number(r['Monto'])||0, date:r['Fecha']||null,
    tasaMensual: Number(r['Tasa mensual %'])||0,
    status: r['Estado']||'Pendiente', abonos:[]
  })).filter(p=>p.name);

  const nuevasMetas = (sheets['Metas']||[]).map(r=>({
    id:uid(), name:String(r['Nombre']||'').trim(), montoObjetivo:Number(r['Monto objetivo'])||0,
    fechaLimite: r['Fecha límite']||null, aportes:[], createdAt:Date.now()
  })).filter(m=>m.name);

  const movimientos = sheets['Movimientos']||[];
  const advertencias = [];

  movimientos.forEach(row=>{
    const tipo = row['Tipo'];
    const nombre = String(row['Nombre']||'').trim();
    const fecha = row['Fecha'] ? String(row['Fecha']) : '';
    const monto = Number(row['Monto'])||0;
    if(!nombre || !fecha || monto<=0) return;

    if(tipo==='Ingreso'){
      const item = nuevosIngresos.find(i=>i.name===nombre);
      if(item){ const mesKey = fecha.length>7?fecha.slice(0,7):fecha; if(!item.registros) item.registros={}; item.registros[mesKey] = { fecha: fecha.length>7?fecha:null, monto }; }
      else advertencias.push(`No se encontró el ingreso "${nombre}" (movimiento de ${fecha}).`);
    } else if(tipo==='Fijo'){
      const item = nuevosFijos.find(i=>i.name===nombre && !i.isProvision);
      if(item){ const mesKey = fecha.length>7?fecha.slice(0,7):fecha; if(!item.registros) item.registros={}; item.registros[mesKey] = { fecha: fecha.length>7?fecha:null, monto }; }
      else advertencias.push(`No se encontró el pago fijo "${nombre}" (movimiento de ${fecha}).`);
    } else if(tipo==='Provisión'){
      let item = nuevosFijos.find(i=>i.isProvision && i.name===nombre);
      if(!item){
        const provisiones = nuevosFijos.filter(i=>i.isProvision);
        if(provisiones.length===1) item = provisiones[0];
      }
      if(item){
        const mes = fecha.slice(0,7);
        if(!item.transactions[mes]) item.transactions[mes]=[];
        item.transactions[mes].push({id:uid(), desc:nombre, amount:monto, date:fecha});
      } else {
        advertencias.push(`No se pudo ubicar en qué provisión va el gasto "${nombre}" (${fecha}).`);
      }
    } else if(tipo==='Ahorro'){
      const item = nuevosCiclicos.find(c=>c.name===nombre);
      if(item) item.contributions[fecha]=monto;
      else advertencias.push(`No se encontró el ahorro "${nombre}" (aporte de ${fecha}).`);
    } else if(tipo==='Abono a deuda'){
      const item = nuevosEspera.find(e=>e.name===nombre);
      if(item) item.abonos.push({id:uid(), amount:monto, date:fecha});
      else advertencias.push(`No se encontró la deuda "${nombre}" (abono de ${fecha}).`);
    } else if(tipo==='Cobro de préstamo'){
      const item = nuevosPrestamos.find(p=>p.name===nombre);
      if(item) item.abonos.push({id:uid(), amount:monto, date:fecha});
      else advertencias.push(`No se encontró el préstamo "${nombre}" (cobro de ${fecha}).`);
    } else if(tipo==='Aporte a meta'){
      const item = nuevasMetas.find(m=>m.name===nombre);
      if(item) item.aportes.push({id:uid(), amount:monto, date:fecha});
      else advertencias.push(`No se encontró la meta "${nombre}" (aporte de ${fecha}).`);
    }
  });

  nuevosEspera.forEach(e=>{ e.status = deudaSaldoActual('espera', e) <= 0 ? 'Pagado' : 'Pendiente'; });
  nuevosPrestamos.forEach(p=>{ p.status = deudaSaldoActual('prestamos', p) <= 0 ? 'Pagado' : 'Pendiente'; });

  return {
    ingresos:nuevosIngresos, fijos:nuevosFijos, ciclicos:nuevosCiclicos,
    extraordinarios:nuevosImprevistos, espera:nuevosEspera, prestamos:nuevosPrestamos,
    metas:nuevasMetas, advertencias,
  };
}

function onGastosImportFileSelected(event){
  const file = event.target.files && event.target.files[0];
  if(!file) return;
  if(typeof XLSX === 'undefined'){
    alert('No se pudo cargar la librería de Excel. Verifica tu conexión a internet e intenta de nuevo.');
    return;
  }
  const reader = new FileReader();
  reader.onload = function(e){
    try{
      const data = new Uint8Array(e.target.result);
      const workbook = XLSX.read(data, {type:'array'});
      const sheets = {};
      workbook.SheetNames.forEach(name=>{
        sheets[name] = XLSX.utils.sheet_to_json(workbook.Sheets[name]);
      });
      gastosImportPendingData = procesarImportacionGastos(sheets);
      gastosImportConfirmPending = true;
      render();
    }catch(err){
      console.error('Error leyendo el Excel', err);
      alert('No se pudo leer el archivo. Verifica que sea un Excel válido exportado desde aquí.');
    }
  };
  reader.readAsArrayBuffer(file);
}

async function runImport(){
  const raw = pendingImportText;
  const lines = raw.split(/\r?\n/).filter(l=>l.trim().length>0);
  if(lines.length<2){ alert('No se encontraron filas de datos debajo del encabezado.'); importConfirmPending=false; render(); return; }
  const headers = lines[0].split('\t').map(h=>h.trim());
  const newTasks = [];
  const warnings = [];
  for(let i=1;i<lines.length;i++){
    const filaNum = i+1;
    const cells = lines[i].split('\t');
    const row = {};
    headers.forEach((h,idx)=> row[h] = (cells[idx]||'').trim());
    const name = row['Nombre'];
    if(!name) continue;

    const areaLabel = row['Área'];
    let area = null;
    if(areaLabel){
      for(const k of AREAS){ if(AREA_LABEL[k]===areaLabel || k===areaLabel){ area=k; break; } }
      if(!area) warnings.push(`Fila ${filaNum} ("${name}"): el área "${areaLabel}" no es válida. Debe ser una de: ${AREAS.map(a=>AREA_LABEL[a]).join(', ')}. Se dejó en blanco.`);
    }

    let priority = null;
    if(row['Prioridad']){
      priority = PRIORITIES.includes(row['Prioridad']) ? row['Prioridad'] : null;
      if(!priority) warnings.push(`Fila ${filaNum} ("${name}"): la prioridad "${row['Prioridad']}" no es válida. Debe ser una de: ${PRIORITIES.join(', ')}. Se dejó en blanco.`);
    }

    let effort = null;
    if(row['Esfuerzo']){
      effort = EFFORTS.includes(row['Esfuerzo']) ? row['Esfuerzo'] : null;
      if(!effort) warnings.push(`Fila ${filaNum} ("${name}"): el esfuerzo "${row['Esfuerzo']}" no es válido. Debe ser uno de: ${EFFORTS.join(', ')}. Se dejó en blanco.`);
    }

    let energy = null;
    if(row['Energía']){
      energy = ENERGIES.includes(row['Energía']) ? row['Energía'] : null;
      if(!energy) warnings.push(`Fila ${filaNum} ("${name}"): la energía "${row['Energía']}" no es válida. Debe ser una de: ${ENERGIES.join(', ')}. Se dejó en blanco.`);
    }

    let date = null;
    if(row['Fecha']){
      date = /^\d{4}-\d{2}-\d{2}$/.test(row['Fecha']) ? row['Fecha'] : null;
      if(!date) warnings.push(`Fila ${filaNum} ("${name}"): la fecha "${row['Fecha']}" no tiene el formato válido. Debe ser AAAA-MM-DD (ejemplo: 2026-07-21). Se dejó en blanco.`);
    }

    let status = 'Por organizar';
    if(row['Estado']){
      if(STATUSES.includes(row['Estado'])){
        status = row['Estado'];
      } else {
        warnings.push(`Fila ${filaNum} ("${name}"): el estado "${row['Estado']}" no es válido. Debe ser uno de: ${STATUSES.join(', ')}. Se usó "Por organizar".`);
      }
    }

    const notes = row['Observaciones'] || '';

    let completedDate = null;
    if(row['Fecha completada']){
      completedDate = /^\d{4}-\d{2}-\d{2}$/.test(row['Fecha completada']) ? row['Fecha completada'] : null;
      if(!completedDate) warnings.push(`Fila ${filaNum} ("${name}"): la fecha completada "${row['Fecha completada']}" no tiene el formato válido. Debe ser AAAA-MM-DD. Se dejó en blanco.`);
    }

    const projectName = row['Proyecto'];
    let project = null;
    if(projectName){
      project = getOrCreateProject(projectName, area);
      if(project.area) area = project.area;
    }

    newTasks.push({
      id: uid(), name, area, priority, effort, energy, date, status,
      project: project?project.name:null, notes, completedDate, createdAt: Date.now(),
    });
  }
  tasks = newTasks;
  await saveTasks();
  await saveProjects();
  pendingImportText = '';
  importConfirmPending = false;
  importWarnings = warnings;
  render();
  if(warnings.length===0){
    alert(tasks.length + ' tarea(s) importada(s). Se reemplazaron todas las tareas anteriores.');
  }
}
