async function onCrearTarea(area){
  const nameInput = document.getElementById('c_name_'+area);
  const raw = nameInput.value;
  const lines = raw.split(/\r?\n/).map(l=>l.trim()).filter(l=>l.length>0);
  if(lines.length===0){ nameInput.focus(); return; }
  lines.forEach(name=>{
    tasks.push({
      id: uid(),
      name,
      area: area,
      date: null,
      priority: null,
      effort: null,
      energy: null,
      project: null,
      notes: '',
      status: 'Por organizar',
      completedDate: null,
      createdAt: Date.now(),
    });
  });
  await saveTasks();
  nameInput.value='';
  nameInput.style.height='';
  nameInput.focus();
}

async function onSaveOrganize(id){
  const isNew = (id === '__new__');
  let t = isNew ? null : tasks.find(x=>x.id===id);
  if(!isNew && !t) return;

  const name = document.getElementById('d_name').value.trim();
  const area = document.getElementById('d_area').value || null;
  const date = document.getElementById('d_date').value || null;
  const priority = document.getElementById('d_priority').value || null;
  const effort = document.getElementById('d_effort').value || null;
  const energy = document.getElementById('d_energy').value || null;
  const notes = document.getElementById('d_notes').value || '';

  const faltantes = [];
  if(!name) faltantes.push('nombre');
  if(!area) faltantes.push('área');
  if(!date) faltantes.push('fecha');
  if(!priority) faltantes.push('prioridad');
  if(!effort) faltantes.push('esfuerzo');
  if(!energy) faltantes.push('energía');
  if(faltantes.length){
    alert('Falta completar: ' + faltantes.join(', ') + '. Todos los campos son obligatorios, excepto proyecto y observaciones.');
    return;
  }

  const projectName = document.getElementById('d_project').value.trim();
  let project = null;
  if(projectName){
    const existing = projects.find(p=>p.name.toLowerCase()===projectName.toLowerCase());
    if(existing){
      if(existing.area && existing.area !== area){
        alert(`El proyecto "${existing.name}" pertenece al área ${AREA_LABEL[existing.area]}, pero elegiste ${AREA_LABEL[area]} para esta tarea. Ajusta el área de la tarea o elige otro proyecto.`);
        return;
      }
      project = existing;
    } else {
      project = getOrCreateProject(projectName, area);
    }
  }

  if(isNew){
    t = {
      id: uid(), name, area, date, priority, effort, energy,
      project: project?project.name:null, notes, status:'Sin iniciar',
      completedDate:null, createdAt: Date.now(),
    };
    tasks.push(t);
  } else {
    t.name = name;
    t.area = area;
    t.date = date;
    t.priority = priority;
    t.effort = effort;
    t.energy = energy;
    t.project = project ? project.name : null;
    t.notes = notes;
    t.status = 'Sin iniciar';
  }
  await saveTasks();
  await saveProjects();
  editingTaskId = null;
  render();
}

async function onSaveMatrix(id){
  const t = tasks.find(x=>x.id===id);
  if(!t) return;
  const newName = document.getElementById('m_name_'+id).value.trim() || t.name;
  const newDate = document.getElementById('m_date_'+id).value || null;
  let projectName = document.getElementById('m_project_'+id).value.trim();
  let project = null;
  if(projectName){
    const existing = projects.find(p=>p.name.toLowerCase()===projectName.toLowerCase());
    if(existing){
      if(existing.area && existing.area !== t.area){
        alert(`El proyecto "${existing.name}" pertenece al área ${AREA_LABEL[existing.area]}, pero esta tarea es de ${AREA_LABEL[t.area]}. Ajusta el proyecto o cambia el área de la tarea desde "Organizar tareas".`);
        return;
      }
      project = existing;
    } else {
      project = getOrCreateProject(projectName, t.area);
    }
  }
  t.name = newName;
  t.date = newDate;
  t.project = project ? project.name : null;
  t.priority = document.getElementById('m_priority_'+id).value || null;
  t.effort = document.getElementById('m_effort_'+id).value || null;
  t.energy = document.getElementById('m_energy_'+id).value || null;
  t.status = document.getElementById('m_status_'+id).value;
  const notesEl = document.getElementById('m_notes_'+id);
  t.notes = notesEl ? notesEl.value : (t.notes||'');
  await saveTasks();
  await saveProjects();
  editingTaskId = null;
  render();
}

async function onCompleteMatrix(id){
  const t = tasks.find(x=>x.id===id);
  if(!t) return;
  t.status = 'Terminada';
  t.completedDate = todayStr();
  await saveTasks();
  editingTaskId = null;
  render();
}

async function onPostponeTomorrow(id){
  const t = tasks.find(x=>x.id===id);
  if(!t) return;
  t.date = tomorrowStr();
  await saveTasks();
  render();
}

async function onDeleteMatrix(id){
  tasks = tasks.filter(t=>t.id!==id);
  pendingDeleteId = null;
  editingTaskId = null;
  await saveTasks();
  render();
}

async function onSaveProjectName(id){
  const p = projects.find(x=>x.id===id);
  if(!p) return;
  const input = document.getElementById('proj_name_'+id);
  const areaSelect = document.getElementById('proj_area_'+id);
  const newName = input ? input.value.trim() : '';
  const newArea = areaSelect ? areaSelect.value : p.area;
  if(!newName){ alert('El nombre del proyecto no puede estar vacío.'); return; }
  const oldName = p.name;
  const oldArea = p.area;
  if(newName !== oldName){
    const clash = projects.find(x=>x.id!==id && x.name.toLowerCase()===newName.toLowerCase() && x.area===newArea);
    if(clash){ alert('Ya existe un proyecto con ese nombre en esta área.'); return; }
  }
  p.name = newName;
  p.area = newArea;
  tasks.forEach(t=>{
    if(t.project === oldName){
      t.project = newName;
      if(newArea !== oldArea) t.area = newArea;
    }
  });
  await saveTasks();
  await saveProjects();
  editingProjectId = null;
  render();
}

async function onDeleteProject(id){
  const p = projects.find(x=>x.id===id);
  if(!p) return;
  const stillHasTasks = tasks.some(t=>t.project===p.name);
  if(stillHasTasks){
    alert('Este proyecto todavía tiene actividades asociadas, no se puede eliminar.');
    pendingProjectDeleteId = null;
    render();
    return;
  }
  projects = projects.filter(x=>x.id!==id);
  pendingProjectDeleteId = null;
  await saveProjects();
  render();
}

// ---------- Lógica del módulo Gastos ----------
function gastosListFor(cat){
  if(cat==='ingresos') return gastosIngresos;
  if(cat==='fijos') return gastosFijos;
  if(cat==='ciclicos') return gastosCiclicos;
  if(cat==='extraordinarios') return gastosExtraordinarios;
  if(cat==='espera') return gastosEspera;
  if(cat==='prestamos') return gastosPrestamos;
  return [];
}
function parseMoney(v){
  const n = Number(String(v||'').replace(/[^0-9.-]/g,''));
  return isNaN(n) ? 0 : n;
}

async function onGastosAdd(cat){
  const name = (document.getElementById('gs_new_name_'+cat).value||'').trim();
  if(!name){ alert('Escribe un nombre.'); return; }
  const amount = parseMoney(document.getElementById('gs_new_amount_'+cat).value);
  if(amount<=0){ alert('El monto debe ser mayor a cero.'); return; }

  if(cat==='ciclicos'){
    const period = parseInt(document.getElementById('gs_new_period_ciclicos').value, 10);
    const date = document.getElementById('gs_new_date_ciclicos').value || null;
    if(!period || period<1){ alert('Indica cada cuántos meses se repite (ej. 6).'); return; }
    gastosCiclicos.push({ id:uid(), name, totalAmount:amount, periodMonths:period, nextDueDate:date, contributions:{} });
    await saveGastos('ciclicos');
  } else if(cat==='extraordinarios' || cat==='espera' || cat==='prestamos'){
    const date = document.getElementById('gs_new_date_'+cat).value || null;
    if((cat==='extraordinarios' || cat==='prestamos') && !date){ alert('Indica la fecha.'); return; }
    const newDeuda = { id:uid(), name, amount, date, status:'Pendiente', abonos:[] };
    if(cat==='espera' || cat==='prestamos'){
      const tasaEl = document.getElementById('gs_new_tasa_'+cat);
      const tasa = tasaEl ? parseFloat(tasaEl.value) : 0;
      newDeuda.tasaMensual = isNaN(tasa) ? 0 : tasa;
      const diaPagoEl = document.getElementById('gs_new_diapago_'+cat);
      const diaPago = diaPagoEl ? parseInt(diaPagoEl.value,10) : NaN;
      if(diaPago>=1 && diaPago<=31) newDeuda.diaPago = diaPago;
    }
    if(cat==='espera'){
      const cuotaEl = document.getElementById('gs_new_cuota_espera');
      const cuota = cuotaEl ? parseMoney(cuotaEl.value) : 0;
      if(cuota>0) newDeuda.cuotaPactada = cuota;
    }
    gastosListFor(cat).push(newDeuda);
    await saveGastos(cat);
  } else {
    const isProvision = cat==='fijos' && !!document.getElementById('gs_new_isprovision_fijos') && document.getElementById('gs_new_isprovision_fijos').checked;
    const newItem = { id:uid(), name, amount, overrides:{}, paidMonths:{}, registros:{} };
    if(isProvision){ newItem.isProvision = true; newItem.transactions = {}; }
    if(cat==='fijos'){
      const dueDayEl = document.getElementById('gs_new_dueday_fijos');
      const dueDay = dueDayEl ? parseInt(dueDayEl.value,10) : NaN;
      if(dueDay>=1 && dueDay<=31) newItem.dueDay = dueDay;
    }
    if(cat==='ingresos'){
      const dueDayEl = document.getElementById('gs_new_dueday_ingresos');
      const dueDay = dueDayEl ? parseInt(dueDayEl.value,10) : NaN;
      if(dueDay>=1 && dueDay<=31) newItem.dueDay = dueDay;
    }
    gastosListFor(cat).push(newItem);
    await saveGastos(cat);
  }

  document.getElementById('gs_new_name_'+cat).value='';
  const amountEl = document.getElementById('gs_new_amount_'+cat);
  if(amountEl) amountEl.value='';
  const dateEl = document.getElementById('gs_new_date_'+cat);
  if(dateEl) dateEl.value='';
  const periodEl = document.getElementById('gs_new_period_'+cat);
  if(periodEl) periodEl.value='';
  const tasaEl2 = document.getElementById('gs_new_tasa_espera');
  if(tasaEl2) tasaEl2.value='';
  const tasaEl3 = document.getElementById('gs_new_tasa_prestamos');
  if(tasaEl3) tasaEl3.value='';
  const cuotaEl2 = document.getElementById('gs_new_cuota_espera');
  if(cuotaEl2) cuotaEl2.value='';
  render();
}

async function onGastosSaveEdit(key){
  const [cat, id] = key.split(':');
  const list = gastosListFor(cat);
  const item = list.find(x=>x.id===id);
  if(!item) return;
  const name = (document.getElementById('gs_edit_name_'+id).value||'').trim();
  if(!name){ alert('El nombre no puede estar vacío.'); return; }
  item.name = name;

  if(cat==='ciclicos'){
    const amount = parseMoney(document.getElementById('gs_edit_amount_'+id).value);
    const period = parseInt(document.getElementById('gs_edit_period_'+id).value, 10);
    if(amount<=0 || !period || period<1){ alert('Revisa el monto total y la periodicidad.'); return; }
    item.totalAmount = amount;
    item.periodMonths = period;
    item.nextDueDate = document.getElementById('gs_edit_date_'+id).value || null;
  } else {
    const amount = parseMoney(document.getElementById('gs_edit_amount_'+id).value);
    if(amount<=0){ alert('El monto debe ser mayor a cero.'); return; }
    item.amount = amount;
    const dateEl = document.getElementById('gs_edit_date_'+id);
    if(dateEl) item.date = dateEl.value || null;
    if(cat==='fijos'){
      const dueDayEl = document.getElementById('gs_edit_dueday_'+id);
      const dueDay = dueDayEl ? parseInt(dueDayEl.value,10) : NaN;
      item.dueDay = (dueDay>=1 && dueDay<=31) ? dueDay : null;
    }
    if(cat==='ingresos'){
      const dueDayEl = document.getElementById('gs_edit_dueday_'+id);
      const dueDay = dueDayEl ? parseInt(dueDayEl.value,10) : NaN;
      item.dueDay = (dueDay>=1 && dueDay<=31) ? dueDay : null;
    }
    if(cat==='espera' || cat==='prestamos'){
      const tasaEl = document.getElementById('gs_edit_tasa_'+id);
      const tasa = tasaEl ? parseFloat(tasaEl.value) : 0;
      item.tasaMensual = isNaN(tasa) ? 0 : tasa;
      const diaPagoEl = document.getElementById('gs_edit_diapago_'+id);
      const diaPago = diaPagoEl ? parseInt(diaPagoEl.value,10) : NaN;
      item.diaPago = (diaPago>=1 && diaPago<=31) ? diaPago : null;
    }
    if(cat==='espera'){
      const cuotaEl = document.getElementById('gs_edit_cuota_'+id);
      const cuota = cuotaEl ? parseMoney(cuotaEl.value) : 0;
      item.cuotaPactada = cuota>0 ? cuota : null;
    }
  }

  gastosEditingId = null;
  await saveGastos(cat);
  render();
}

async function onGastosDelete(key){
  const [cat, id] = key.split(':');
  const list = gastosListFor(cat);
  const idx = list.findIndex(x=>x.id===id);
  if(idx>=0) list.splice(idx,1);
  gastosPendingDeleteId = null;
  await saveGastos(cat);
  render();
}

async function onGastosToggleStatus(key){
  const [cat, id] = key.split(':');
  const item = gastosListFor(cat).find(x=>x.id===id);
  if(!item) return;
  item.status = item.status==='Pendiente' ? 'Pagado' : 'Pendiente';
  if(item.status==='Pendiente') item.fechaPago = null;
  await saveGastos(cat);
  render();
}

function imprevistoAbonado(item){
  return (item.abonos||[]).reduce((s,a)=>s+Number(a.monto||0),0);
}
function imprevistoEstado(item){
  if(item.abonos && item.abonos.length){
    const abonado = imprevistoAbonado(item);
    const saldo = Math.max(0, Number(item.amount||0) - abonado);
    return { estado: saldo<=0?'pagado':'pendiente', abonado, saldo };
  }
  if(item.status==='Pagado') return { estado:'pagado', abonado:Number(item.amount||0), saldo:0 };
  return { estado:'pendiente', abonado:0, saldo:Number(item.amount||0) };
}
async function onGastosRegistrarImprevisto(id){
  const item = gastosExtraordinarios.find(x=>x.id===id);
  if(!item) return;
  const fechaEl = document.getElementById('gs_reg_imprevisto_fecha_'+id);
  const montoEl = document.getElementById('gs_reg_imprevisto_monto_'+id);
  const fecha = (fechaEl && fechaEl.value) ? fechaEl.value : todayStr();
  const monto = parseMoney(montoEl.value);
  if(monto<0){ alert('El monto no puede ser negativo.'); return; }
  if(!item.abonos) item.abonos = [];
  item.abonos.push({ id:uid(), monto, fecha });
  const info = imprevistoEstado(item);
  if(info.estado==='pagado'){
    item.status = 'Pagado';
    item.fechaPago = fecha;
  }
  gastosEditingId = null;
  await saveGastos('extraordinarios');
  render();
}
async function onGastosDeshacerAbonoImprevisto(id){
  const item = gastosExtraordinarios.find(x=>x.id===id);
  if(!item || !item.abonos || !item.abonos.length) return;
  item.abonos.pop();
  const info = imprevistoEstado(item);
  if(info.estado!=='pagado'){
    item.status = 'Pendiente';
    item.fechaPago = null;
  }
  await saveGastos('extraordinarios');
  render();
}

async function onGastosAplazarImprevisto(id){
  const item = gastosExtraordinarios.find(x=>x.id===id);
  if(!item || !item.date) return;
  item.date = addMonthsToDate(item.date, 1);
  await saveGastos('extraordinarios');
  render();
}

async function onGastosContribute(id){
  const c = gastosCiclicos.find(x=>x.id===id);
  if(!c) return;
  if(!c.contributions) c.contributions = {};
  if(c.contributions[gastosViewMonth] !== undefined) return;
  const provision = Number(c.totalAmount||0)/Math.max(1,Number(c.periodMonths||1));
  c.contributions[gastosViewMonth] = provision;
  await saveGastos('ciclicos');
  render();
}
async function onGastosUndoContribute(id){
  const c = gastosCiclicos.find(x=>x.id===id);
  if(!c || !c.contributions) return;
  delete c.contributions[gastosViewMonth];
  await saveGastos('ciclicos');
  render();
}

async function onGastosMarkPaid(id){
  const c = gastosCiclicos.find(x=>x.id===id);
  if(!c) return;
  c.contributions = {};
  c.accumulated = 0;
  if(c.nextDueDate){
    c.nextDueDate = addMonthsToDate(c.nextDueDate, c.periodMonths);
  }
  await saveGastos('ciclicos');
  render();
}

function escapeHtml(s){
  return (s||'').replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function escapeAttr(s){ return escapeHtml(s); }

async function init(){
  document.getElementById('content').innerHTML = '<div class="panel">Cargando...</div>';
  gastosViewMonth = currentMonthStr();
  await loadData();
  const changed = reprogramOverdue();
  if(changed) await saveTasks();
  render();

  document.addEventListener('focusin', (e)=>{
    const tag = e.target.tagName;
    if(tag==='INPUT' || tag==='TEXTAREA' || tag==='SELECT'){
      setTimeout(()=>{
        e.target.scrollIntoView({block:'center', behavior:'smooth'});
      }, 300);
    }
  });
}
init();
</script>
